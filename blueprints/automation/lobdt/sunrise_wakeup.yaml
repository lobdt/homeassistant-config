blueprint:
  name: Simulateur d'Aube — Réveil Progressif
  description: >
    # 🌅 Simulateur d'Aube — Réveil Progressif

    **Version: 1.4**


    Monte progressivement la luminosité et la température de couleur pour simuler
    un lever de soleil naturel. Scientifiquement calibré : rouge-orangé chaud →
    blanc lumière du jour, courbe non-linéaire qui accélère vers la fin.


    ## ✨ Fonctionnalités

    - **Heure modifiable** au quotidien depuis un `input_datetime`
    - **Interrupteur on/off** via `input_boolean` (exposable dans HomeKit)
    - **Courbe non-linéaire** : lente au début, s'accélère (comme un vrai soleil)
    - **2e lampe dérivée (optionnel)** : pour une lampe au ressenti lumineux
      très différent de la principale (ex : trop proche/puissante pour suivre
      le même pourcentage brut), sa luminosité est calculée à partir de celle
      de la lampe principale — seuil bas, multiplicateur, palier haut
      configurable. Même principe que le blueprint maison
      `philips_hue_tap_dial_dynamic_dimming.yaml`, mais implémenté ici de
      façon autonome (pas de dépendance partagée entre les deux blueprints).
    - **Adaptive Lighting** : coupe le(s) switch(s) AL avant le lever, le(s)
      réactive à la fin + apply immédiat — un champ par lampe
    - **Abort intelligent** : si la lampe principale est éteinte manuellement,
      s'arrête
    - **Actions pré et post** lever optionnelles
    - **Sélection de jours** de la semaine


    ## 🔬 Paramètres scientifiques par défaut

    Durée 25 min · 2200 K → 5500 K · Luminosité 1% → 100%
    (études circadiennes : montée douce chaud→froid favorise l'éveil naturel
    et supprime la mélatonine résiduelle sans choc lumineux)


    ## 📋 Prérequis

    - `input_datetime` (heure seule) pour l'heure de réveil
    - `input_boolean` pour activer/désactiver
    - Lumière avec support luminosité + température de couleur


    **Changelog v1.4 :** correctif — la lampe 2 sous le seuil bas recevait un
    `light.turn_off` répété à chaque pas de la rampe (toutes les
    `step_interval`), même déjà éteinte. Chaque appel portait une
    `transition` égale à l'intervalle des pas, jamais laissée le temps de se
    terminer avant le suivant → `Operation aborted` en boucle
    (`continue_on_error: true` masquait l'échec). Ajout d'une garde
    `condition: state` (lampe 2 actuellement "on" ?) avant l'appel : plus
    aucun appel redondant sur une lampe déjà éteinte.

    **Changelog v1.3 :** réorganisation des catégories — `duration_number` et
    `step_interval` (paramètres de timing partagés par les deux lampes, pas
    propres à l'une ou l'autre) déplacés dans "1️⃣ Essentiel" ; "2️⃣ Courbe de
    lever de soleil" renommée "2️⃣ Courbe — Lampe principale" et ne contient
    plus que les valeurs réellement propres à la lampe 1
    (`start_brightness`/`end_brightness`/`start_kelvin`/`end_kelvin`),
    symétrique à ce que contient "2️⃣bis" pour la lampe 2.

    **Changelog v1.2 :** 3 corrections — (1) section "Deuxième lampe dérivée"
    déplacée juste après "Courbe de lever de soleil" au lieu d'après "Jours
    actifs" ; (2) toute valeur Kelvin envoyée à chaque lampe (départ, chaque
    pas de la rampe, arrivée) est désormais plafonnée à la plage réellement
    supportée par CETTE lampe (`min_color_temp_kelvin`/`max_color_temp_kelvin`
    de son entité) — les 2 lampes n'ont pas forcément les mêmes limites
    matérielles, donc chacune est clampée indépendamment plutôt que d'utiliser
    aveuglément la même valeur `start_kelvin`/`end_kelvin` pour les deux ;
    (3) coquille "Version 1.1" sans `:` corrigée.

    **Changelog v1.1 :** ajout du support d'une 2e lampe dérivée
    (`light_entity_2` + seuil bas/multiplicateur/palier haut configurables)
    pour gérer proprement 2 lampes au ressenti lumineux différent dans la
    même pièce, avec coordination Adaptive Lighting indépendante pour
    chacune (`al_switch_2`). Auparavant, seule une lampe unique (ou un
    groupe, qui applique alors le même % brut à toutes ses lampes membres,
    sans tenir compte de leurs différences de ressenti) était supportée.

    **Changelog v1.0 :** version initiale.

  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config

  input:
    # ─────────────────────────────────────────────────────
    section_core:
      name: 1️⃣ Essentiel
      icon: mdi:alarm
      input:
        light_entity:
          name: Lumière cible
          description: >
            La lumière à faire monter. Doit supporter luminosité ET température
            de couleur. Pour plusieurs lampes, crée un groupe de lumières.
          selector:
            entity:
              filter:
                - domain: light

        alarm_time:
          name: Heure de réveil (input_datetime)
          description: >
            Helper `input_datetime` (heure seule) = **l'heure à laquelle tu veux
            être réveillé**. La lumière atteindra 100% exactement à cette heure.

            ⚠️ Ce helper seul ne suffit pas — il faut aussi créer le sensor
            de démarrage ci-dessous.
          selector:
            entity:
              filter:
                - domain: input_datetime

        start_sensor:
          name: Sensor heure de démarrage (template sensor)
          description: >
            Sensor template avec `device_class: timestamp` qui calcule
            automatiquement `heure_réveil - durée`.

            **Comment le créer :** Paramètres → Helpers → Créer un helper →
            Template → Sensor → colle ce template (adapte l'entity_id et la
            durée) :

            `{{ (today_at(states('input_datetime.heure_reveil_chambre')) - timedelta(minutes=25)).isoformat() }}`

            Puis sélectionne `device_class: timestamp`.

            Ce sensor se met à jour automatiquement quand tu changes l'heure
            de réveil. Le trigger `time` le surveille et démarre exactement
            au bon moment — zéro polling, zéro ressource gaspillée.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: timestamp

        enabled_boolean:
          name: Interrupteur on/off (input_boolean)
          description: >
            Active ou désactive le réveil. Expose-le dans HomeKit pour un contrôle
            rapide depuis Siri ("Dis Siri, active le réveil") ou l'app Maison.
          selector:
            entity:
              filter:
                - domain: input_boolean

        duration_number:
          name: Durée du lever (input_number)
          description: >
            Helper `input_number` qui stocke la durée en minutes. Créer via
            Paramètres → Helpers → `input_number` (min 5, max 60, step 5, unité min).

            Le sensor de démarrage lit ce helper automatiquement — si tu changes
            la durée ici, l'heure de démarrage se recalcule toute seule.

            Pilote la cadence des DEUX lampes (pas propre à une lampe en
            particulier) — d'où sa place ici plutôt que dans une section
            "par lampe".

            Valeur recommandée : **25 min** (consensus scientifique).
          selector:
            entity:
              filter:
                - domain: input_number

        step_interval:
          name: Intervalle entre chaque pas (secondes)
          description: >
            Temps entre deux ajustements. Philips Hue : 10-15s recommandé.
            Plus court = plus fluide, mais plus d'appels Zigbee.

            Comme `duration_number`, pilote la cadence des deux lampes —
            groupé ici plutôt que dans "Courbe — Lampe principale".
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: s
              mode: slider

    # ─────────────────────────────────────────────────────
    section_curve:
      name: 2️⃣ Courbe — Lampe principale
      icon: mdi:brightness-6
      input:
        start_brightness:
          name: Luminosité de départ (%)
          description: >
            Luminosité initiale. Garder à 1-3% pour un début imperceptible.
            Monter à 5% si l'ampoule ne répond pas aux valeurs très basses.
          default: 1
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: slider

        end_brightness:
          name: Luminosité finale (%)
          description: >
            Luminosité atteinte à la fin. 100% recommandé pour un réveil énergisant.
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 5
              mode: slider

        start_kelvin:
          name: Température de départ (Kelvin — chaud)
          description: >
            Couleur au début : 2200 K = rouge-orangé (lever de soleil naturel).
            Science : partir chaud évite le choc lumineux et ne supprime pas
            la mélatonine brutalement.
          default: 2200
          selector:
            number:
              min: 1800
              max: 3000
              step: 100
              unit_of_measurement: K
              mode: slider

        end_kelvin:
          name: Température finale (Kelvin — lumière du jour)
          description: >
            Couleur en fin de lever : 5500 K = blanc lumière du jour.
            Science : 5000-5500 K stimule l'éveil et supprime la mélatonine
            résiduelle. Baisser à 4000 K pour une fin plus douce.
          default: 5500
          selector:
            number:
              min: 3000
              max: 6500
              step: 100
              unit_of_measurement: K
              mode: slider

    # ─────────────────────────────────────────────────────
    section_second_light:
      name: 2️⃣bis Deuxième lampe dérivée (optionnel)
      icon: mdi:lightbulb-multiple
      collapsed: true
      input:
        light_entity_2:
          name: Deuxième lampe (optionnel)
          description: >
            Une 2e lampe dont la luminosité est calculée à partir de celle de
            la lampe principale, plutôt que de recevoir le même pourcentage
            brut — utile quand les 2 lampes n'ont pas le même ressenti
            lumineux pour un même %.

            Laisser vide pour ne piloter qu'une seule lampe.
          default: []
          selector:
            entity:
              filter:
                - domain: light

        light_entity_2_low_threshold:
          name: Seuil bas (%)
          description: >
            Tant que la lampe principale reste sous ce %, la 2e lampe reste
            éteinte. Évite qu'une lampe puissante/proche s'allume trop tôt
            dans le lever.
          default: 16
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box

        light_entity_2_multiplier:
          name: Multiplicateur
          description: >
            Au-dessus du seuil bas, la 2e lampe suit `lampe 1 × ce
            multiplicateur`, jusqu'au palier haut ci-dessous où elle
            interpole ensuite linéairement.
          default: 0.3
          selector:
            number:
              min: 0.05
              max: 2
              step: 0.05
              mode: box

        light_entity_2_max_brightness:
          name: Palier haut (%)
          description: >
            Luminosité maximale de la 2e lampe, atteinte quand la lampe
            principale arrive à 100%. Mets la valeur qui correspond au
            plafond confortable de cette lampe (pas forcément 100%).
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box

    # ─────────────────────────────────────────────────────
    section_schedule:
      name: 3️⃣ Jours actifs
      icon: mdi:calendar-week
      input:
        days_of_week:
          name: Jours de la semaine
          description: Laisser vide = tous les jours.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: Lundi
                  value: mon
                - label: Mardi
                  value: tue
                - label: Mercredi
                  value: wed
                - label: Jeudi
                  value: thu
                - label: Vendredi
                  value: fri
                - label: Samedi
                  value: sat
                - label: Dimanche
                  value: sun

    # ─────────────────────────────────────────────────────
    section_adaptive:
      name: 4️⃣ Adaptive Lighting (optionnel)
      icon: mdi:theme-light-dark
      collapsed: true
      input:
        al_switch:
          name: Switch Adaptive Lighting de la lampe principale
          description: >
            Le switch principal AL de ta lampe cible, ex :
            `switch.adaptive_lighting_chambre_armoire`.

            Couper ce switch désactive complètement AL pour cette lampe pendant
            le lever. Il est réactivé automatiquement à la fin, suivi d'un
            `adaptive_lighting.apply` pour une reprise immédiate.

            Laisser vide si pas d'Adaptive Lighting sur cette lampe.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting

        al_switch_2:
          name: Switch Adaptive Lighting de la 2e lampe (optionnel)
          description: >
            Si tu utilises une 2e lampe dérivée (light_entity_2), indique ici
            son propre switch Adaptive Lighting pour qu'il soit coupé/réactivé
            en même temps que celui de la lampe principale.

            Laisser vide si pas d'Adaptive Lighting sur cette 2e lampe.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting

    # ─────────────────────────────────────────────────────
    section_bypass:
      name: 5️⃣ Bypass mouvement (optionnel)
      icon: mdi:motion-sensor-off
      collapsed: true
      input:
        bypass_boolean:
          name: Input boolean de bypass mouvement
          description: >
            Helper `input_boolean` activé pendant toute la durée du lever pour
            bloquer les automations de mouvement (ex : empêcher un capteur de
            mouvement d'éteindre la lumière pendant le lever).

            Activé juste avant l'allumage initial, désactivé à la fin — même en
            cas d'abort par extinction manuelle.

            Exemple : `input_boolean.chambre_bypass_manuel`.
            Laisser vide si non utilisé.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean

    # ─────────────────────────────────────────────────────
    section_actions:
      name: 6️⃣ Actions pré et post lever
      icon: mdi:play-circle-outline
      collapsed: true
      input:
        pre_sunrise_actions:
          name: Actions avant le lever (optionnel)
          description: Exécutées juste avant que la lumière commence à monter.
          default: []
          selector:
            action: {}

        post_sunrise_actions:
          name: Actions après le lever (optionnel)
          description: >
            Exécutées une fois la luminosité maximale atteinte, après que AL a
            repris le contrôle. Ex : lancer un script de scène matinale, une
            radio, une notification...
          default: []
          selector:
            action: {}

mode: single

variables:
  duration_number: !input duration_number
  duration_min: "{{ states(duration_number) | int(25) }}"
  start_brightness: !input start_brightness
  end_brightness: !input end_brightness
  start_kelvin: !input start_kelvin
  end_kelvin: !input end_kelvin
  step_interval: !input step_interval
  days_of_week: !input days_of_week
  light_entity: !input light_entity
  al_switch: !input al_switch
  al_switch_2: !input al_switch_2
  bypass_boolean: !input bypass_boolean
  total_steps: "{{ ((duration_min * 60) / step_interval) | int(1) }}"
  # ── Deuxième lampe dérivée (optionnelle) ──────────────────────────────
  light_entity_2: !input light_entity_2
  light_entity_2_low_threshold: !input light_entity_2_low_threshold
  light_entity_2_multiplier: !input light_entity_2_multiplier
  light_entity_2_max_brightness: !input light_entity_2_max_brightness
  has_light_2: "{{ light_entity_2 | default([]) | length > 0 }}"
  # ── Plage Kelvin réelle de chaque lampe, pour clamper toute valeur envoyée
  #    (les 2 lampes n'ont pas forcément les mêmes limites matérielles —
  #    ex : 2000K mini sur l'une, 2202K sur l'autre)
  light_1_min_k: "{{ state_attr(light_entity, 'min_color_temp_kelvin') | int(1000) }}"
  light_1_max_k: "{{ state_attr(light_entity, 'max_color_temp_kelvin') | int(10000) }}"
  light_2_min_k: "{{ (state_attr(light_entity_2, 'min_color_temp_kelvin') | int(1000)) if has_light_2 else 1000 }}"
  light_2_max_k: "{{ (state_attr(light_entity_2, 'max_color_temp_kelvin') | int(10000)) if has_light_2 else 10000 }}"

trigger:
  - platform: time
    at: !input start_sensor

condition:
  # Vérifier que le boolean est activé
  - condition: state
    entity_id: !input enabled_boolean
    state: "on"
  # Vérifier le jour de la semaine
  - condition: template
    value_template: >
      {{ days_of_week | length == 0 or now().strftime('%a').lower()[:3] in days_of_week }}

action:
  # 1. Couper le(s) switch(s) AL — AL ne touche plus les lampes pendant le lever
  - if:
      - condition: template
        value_template: "{{ al_switch | default([]) | length > 0 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: !input al_switch
        alias: Couper AL (lampe principale)
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ al_switch_2 | default([]) | length > 0 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: !input al_switch_2
        alias: Couper AL (2e lampe)
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ (al_switch | default([]) | length > 0) or (al_switch_2 | default([]) | length > 0) }}"
    then:
      - delay:
          seconds: 1
        alias: Laisser AL terminer ses opérations en cours avant d'allumer

  # 2. Activer le bypass mouvement — bloque les capteurs pendant le lever
  - if:
      - condition: template
        value_template: "{{ bypass_boolean | default([]) | length > 0 }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: !input bypass_boolean
        alias: Activer bypass mouvement
        continue_on_error: true

  # 3. Actions pré-lever optionnelles
  - choose: []
    default: !input pre_sunrise_actions

  # 4. Allumer à la valeur de départ (Kelvin plafonné à la plage réelle de la lampe)
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ start_brightness }}"
      color_temp_kelvin: "{{ [[start_kelvin, light_1_min_k] | max, light_1_max_k] | min }}"
    continue_on_error: true

  # 4bis-a. Allumer la 2e lampe dérivée si configurée et si start_brightness
  #         dépasse déjà son seuil bas (avec les défauts start=1%/seuil=16%,
  #         elle reste éteinte au départ — normal, elle rejoint plus tard)
  - if:
      - condition: template
        value_template: "{{ has_light_2 and (start_brightness | float) >= (light_entity_2_low_threshold | float) }}"
    then:
      - action: light.turn_on
        target:
          entity_id: !input light_entity_2
        data:
          brightness_pct: >
            {% set l1 = start_brightness | float %}
            {% set mult = light_entity_2_multiplier | float %}
            {% set ceil = light_entity_2_max_brightness | float %}
            {% set blend_start = [100 * mult, 100] | min %}
            {% if l1 >= blend_start %}
              {% set start_l2 = blend_start * mult %}
              {% set span = 100 - blend_start %}
              {% set progress = 0 if span <= 0 else (l1 - blend_start) / span %}
              {{ (start_l2 + progress * (ceil - start_l2)) | round(0) | int }}
            {% else %}
              {{ (l1 * mult) | round(0) | int }}
            {% endif %}
          color_temp_kelvin: "{{ [[start_kelvin, light_2_min_k] | max, light_2_max_k] | min }}"
        continue_on_error: true

  # 4bis. Attendre la confirmation Zigbee avant le premier check de la boucle
  #       (plus propre qu'un délai fixe : continue dès que la lampe confirme,
  #       timeout 5s en cas de problème Zigbee)
  - wait_for_trigger:
      - trigger: state
        entity_id: !input light_entity
        to: "on"
    timeout:
      seconds: 5
    continue_on_timeout: true
    alias: Attendre confirmation Zigbee (max 5s)

  # 5. Boucle de montée progressive (courbe non-linéaire puissance 1.3 / 1.5)
  - repeat:
      while:
        - condition: template
          value_template: "{{ repeat.index <= total_steps }}"
        - condition: state
          entity_id: !input light_entity
          state: "on"
      sequence:
        - variables:
            l1_pct_now: >
              {{ (start_brightness + (end_brightness - start_brightness) * ((repeat.index / total_steps) ** 1.3)) | int }}
            l1_kelvin_raw: >
              {{ (start_kelvin + (end_kelvin - start_kelvin) * (1 - ((1 - repeat.index / total_steps) ** 1.5))) | int }}
            l1_kelvin_now: "{{ [[l1_kelvin_raw, light_1_min_k] | max, light_1_max_k] | min }}"
            l2_kelvin_now: "{{ [[l1_kelvin_raw, light_2_min_k] | max, light_2_max_k] | min }}"

        - action: light.turn_on
          target:
            entity_id: !input light_entity
          data:
            brightness_pct: "{{ l1_pct_now }}"
            color_temp_kelvin: "{{ l1_kelvin_now }}"
            transition: "{{ step_interval }}"
          continue_on_error: true

        # 2e lampe dérivée : éteinte sous le seuil bas, dérivée de l1_pct_now
        # au-dessus (seuil/multiplicateur/palier haut configurables)
        - if:
            - condition: template
              value_template: "{{ has_light_2 }}"
          then:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ (l1_pct_now | float) < (light_entity_2_low_threshold | float) }}"
                  sequence:
                    - condition: state
                      entity_id: !input light_entity_2
                      state: "on"
                    - action: light.turn_off
                      target:
                        entity_id: !input light_entity_2
                      data:
                        transition: "{{ step_interval }}"
                      continue_on_error: true
              default:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity_2
                  data:
                    brightness_pct: >
                      {% set l1 = l1_pct_now | float %}
                      {% set mult = light_entity_2_multiplier | float %}
                      {% set ceil = light_entity_2_max_brightness | float %}
                      {% set blend_start = [100 * mult, 100] | min %}
                      {% if l1 >= blend_start %}
                        {% set start_l2 = blend_start * mult %}
                        {% set span = 100 - blend_start %}
                        {% set progress = 0 if span <= 0 else (l1 - blend_start) / span %}
                        {{ (start_l2 + progress * (ceil - start_l2)) | round(0) | int }}
                      {% else %}
                        {{ (l1 * mult) | round(0) | int }}
                      {% endif %}
                    color_temp_kelvin: "{{ l2_kelvin_now }}"
                    transition: "{{ step_interval }}"
                  continue_on_error: true

        - delay:
            seconds: "{{ step_interval }}"

  # 6. Réactiver AL + désactiver bypass — TOUJOURS (même si abort par extinction manuelle)
  #    Placé avant la condition bloquante ci-dessous pour garantir le nettoyage.
  - if:
      - condition: template
        value_template: "{{ al_switch | default([]) | length > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: !input al_switch
        alias: Réactiver AL (lampe principale)
        continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ al_switch_2 | default([]) | length > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: !input al_switch_2
        alias: Réactiver AL (2e lampe)
        continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ bypass_boolean | default([]) | length > 0 }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: !input bypass_boolean
        alias: Désactiver bypass mouvement
        continue_on_error: true

  # 7. Finaliser à la cible exacte (uniquement si lampe encore allumée)
  - condition: state
    entity_id: !input light_entity
    state: "on"

  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ end_brightness }}"
      color_temp_kelvin: "{{ [[end_kelvin, light_1_min_k] | max, light_1_max_k] | min }}"
    continue_on_error: true

  # 7bis. Finaliser la 2e lampe à son palier haut configuré (pas forcément
  #       100% — c'est justement le but : respecter son plafond confortable)
  - if:
      - condition: template
        value_template: "{{ has_light_2 }}"
      - condition: state
        entity_id: !input light_entity_2
        state: "on"
    then:
      - action: light.turn_on
        target:
          entity_id: !input light_entity_2
        data:
          brightness_pct: "{{ light_entity_2_max_brightness }}"
          color_temp_kelvin: "{{ [[end_kelvin, light_2_min_k] | max, light_2_max_k] | min }}"
        continue_on_error: true

  # 8. AL reprend immédiatement (sans attendre son prochain cycle naturel)
  - if:
      - condition: template
        value_template: "{{ al_switch | default([]) | length > 0 }}"
    then:
      - action: adaptive_lighting.apply
        data:
          entity_id: !input al_switch
          lights: !input light_entity
          transition: 5
        alias: Réappliquer AL en douceur (5s) — lampe principale
        continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ al_switch_2 | default([]) | length > 0 }}"
    then:
      - action: adaptive_lighting.apply
        data:
          entity_id: !input al_switch_2
          lights: !input light_entity_2
          transition: 5
        alias: Réappliquer AL en douceur (5s) — 2e lampe
        continue_on_error: true

  # 9. Actions post-lever
  - choose: []
    default: !input post_sunrise_actions
