# ============================================================================
# CHANGELOG
# ============================================================================
#
# v1.0 (15/08/2026) — Version initiale.
#
#   Écrit pour l'IKEA BILRESA scroll wheel (E2490) intégrée en **Matter/Thread
#   direct**, PAS en Zigbee2MQTT ni ZHA. C'est la distinction déterminante :
#   la quasi-totalité des blueprints communautaires pour cet appareil lisent le
#   payload MQTT brut de Z2M et sont donc inutilisables sur une intégration
#   Matter, qui expose des entités `event.*` avec des `event_types`
#   `multi_press_N`.
#
#   Trois comportements du matériel ont été établis par mesure directe avant
#   d'écrire une ligne de code (17 gestes, 3 sessions, 2 versions de firmware) :
#
#   1. Seuls 4 des 9 canaux `event.*` exposés sont réellement utilisés.
#      Les canaux 5 à 9 n'ont jamais émis un seul événement.
#
#   2. `multi_press_N` encode le NOMBRE DE CRANS d'un même geste de molette,
#      pas une succession de clics. Rotation lente d'un cran → `multi_press_1`.
#      Rotation franche → jusqu'à `multi_press_7` observé. C'est ce qui permet
#      le dimming proportionnel à l'ampleur du geste implémenté ici.
#
#   3. CHAQUE événement est émis DEUX FOIS, à 1-2 ms d'intervalle. Systématique
#      sur 17/17 gestes. Voir la section "Anti-doublon" plus bas — c'est un
#      contournement d'un bug amont, pas un choix de design.
#
# ============================================================================

blueprint:
  name: IKEA BILRESA Scroll Wheel (Matter) — Dimming proportionnel + mode Kelvin
  description: >
    # 🎛️ IKEA BILRESA Scroll Wheel (Matter)

    **Version: 1.0**


    Pilote une lumière avec la molette IKEA BILRESA (E2490) intégrée en
    **Matter/Thread direct**. Dimming proportionnel à l'ampleur du geste, plus
    un mode température de couleur temporaire déclenché par le bouton du bas.


    ## ⚠️ Matter uniquement — pas Zigbee2MQTT, pas ZHA

    Ce blueprint lit des entités `event.*` produites par l'intégration **Matter**.
    Il ne fonctionnera pas avec une BILRESA appairée en Zigbee2MQTT ou ZHA, qui
    exposent un modèle d'événements totalement différent (payload MQTT brut).
    Les blueprints communautaires existants visent presque tous Z2M/ZHA — d'où
    celui-ci.


    ## ✨ Fonctionnalités

    - **Clic molette** → allume / éteint la lumière
    - **Rotation** → luminosité, avec un pas **proportionnel au nombre de crans**
      tournés dans le geste (tourner doucement ajuste finement, tourner franchement
      traverse la plage)
    - **Bouton du bas** → bascule la molette en réglage de **température de couleur**
      pendant quelques secondes, puis retour automatique à la luminosité
    - **Bornes Kelvin lues sur la lampe elle-même** (`min_color_temp_kelvin` /
      `max_color_temp_kelvin`) — aucune valeur en dur, portable d'une lampe à l'autre
    - **Anti-doublon** intégré (voir ci-dessous)


    ## 🐞 Anti-doublon — pourquoi ce filtre existe

    L'intégration Matter émet **chaque événement deux fois**, à 1-2 ms d'écart.
    Mesuré sur 17 gestes, 3 sessions, et **confirmé identique après mise à jour
    du firmware de la télécommande de 1.8.7 vers 1.9.15** — ce n'est donc pas un
    bug firmware IKEA. Le symptôme est rapporté sur d'autres appareils Matter
    (boutons UniFi Protect, IKEA Tradfri), ce qui pointe vers la couche Matter
    de Home Assistant.

    Sans filtre, chaque cran appliquerait le double du pas.

    Le filtre compare l'horodatage du nouvel événement à celui du précédent et
    ignore tout ce qui arrive sous le seuil configuré (50 ms par défaut). Marge
    volontairement large : les doublons observés sont à 1-2 ms, et aucun geste
    humain ne produit deux crans en moins de 50 ms.

    **Discussion communautaire (non résolue au 15/08/2026) :**
    https://community.home-assistant.io/t/ikea-bilresa-events-firing-twice/969286

    Si une future version de Home Assistant corrige la couche Matter, ce filtre
    deviendra inoffensif mais inutile. Pour le vérifier : regarder le logbook
    d'une entité `event.*` de la télécommande et voir si les entrées apparaissent
    encore par paires à 1-2 ms d'écart.


    ## 🔌 Adaptive Lighting

    Si la lampe est pilotée par Adaptive Lighting, aucune configuration
    supplémentaire n'est nécessaire **à condition** qu'AL soit réglé avec
    `take_over_control: true` et `adapt_only_on_bare_turn_on: true`. Les commandes
    explicites envoyées par ce blueprint mettent alors AL en pause sur cette lampe
    jusqu'au prochain cycle éteint/allumé — le réglage manuel tient.


    ## 📋 Prérequis

    - BILRESA appairée en **Matter/Thread direct** vers Home Assistant
      (pas via un hub Dirigera)
    - Lumière supportant la luminosité ; la température de couleur n'est requise
      que si le mode Kelvin est utilisé


    ## 🔎 Identifier les bons canaux

    L'appareil expose 9 entités `event.*_button_N` mais n'en utilise que 4.
    Pour retrouver la correspondance sur ta propre télécommande : manipule-la et
    regarde lesquelles changent d'état. Sur l'exemplaire de référence :

    - `button_1` = rotation droite · `button_2` = rotation gauche
    - `button_3` = clic molette · `button_4` = bouton du bas

  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config/blob/main/blueprints/automation/lobdt/ikea_bilresa_scroll_wheel_matter.yaml

  input:
    # ─────────────────────────────────────────────────────
    section_core:
      name: 1️⃣ Essentiel
      icon: mdi:knob
      input:
        light_target:
          name: Lumière à piloter
          description: >
            La lumière contrôlée par la molette. Pour plusieurs lampes,
            crée un groupe de lumières et sélectionne-le ici.
          selector:
            entity:
              filter:
                - domain: light

        button_scroll_up:
          name: Canal — rotation vers le haut
          description: >
            Entité `event` correspondant à la rotation qui **augmente**
            (droite / horaire). Canal 1 sur l'exemplaire de référence.
          selector:
            entity:
              filter:
                - domain: event
                  integration: matter

        button_scroll_down:
          name: Canal — rotation vers le bas
          description: >
            Entité `event` correspondant à la rotation qui **diminue**
            (gauche / anti-horaire). Canal 2 sur l'exemplaire de référence.
          selector:
            entity:
              filter:
                - domain: event
                  integration: matter

        button_click:
          name: Canal — clic molette
          description: >
            Entité `event` du clic sur la molette. Déclenche l'allumage /
            extinction. Canal 3 sur l'exemplaire de référence.
          selector:
            entity:
              filter:
                - domain: event
                  integration: matter

    # ─────────────────────────────────────────────────────
    section_brightness:
      name: 2️⃣ Luminosité
      icon: mdi:brightness-6
      input:
        brightness_step:
          name: Pas de luminosité par cran
          description: >
            Pourcentage appliqué **par cran** de molette. Le pas réel d'un geste
            est ce nombre multiplié par le nombre de crans tournés — un geste de
            5 crans avec un pas de 3 déplace la luminosité de 15 %.
          default: 3
          selector:
            number:
              min: 1
              max: 20
              step: 1
              unit_of_measurement: "%"
              mode: slider

        dim_turns_on:
          name: Tourner la molette allume la lampe si elle est éteinte
          description: >
            Si activé, une rotation sur une lampe éteinte l'allume au lieu de
            n'avoir aucun effet.
          default: true
          selector:
            boolean:

    # ─────────────────────────────────────────────────────
    section_kelvin:
      name: 3️⃣ Mode température de couleur
      icon: mdi:temperature-kelvin
      input:
        button_mode:
          name: Canal — bouton de bascule Kelvin
          description: >
            Entité `event` du bouton qui fait passer la molette en réglage de
            température de couleur. Canal 4 sur l'exemplaire de référence.

            Laisser vide (non supporté par le sélecteur : choisir un canal inutilisé)
            si le mode Kelvin n'est pas souhaité — mettre alors la durée ci-dessous
            à sa valeur minimale.
          selector:
            entity:
              filter:
                - domain: event
                  integration: matter

        kelvin_mode_duration:
          name: Durée du mode Kelvin
          description: >
            Après un appui sur le bouton de bascule, la molette règle la
            température de couleur pendant cette durée, puis revient
            automatiquement à la luminosité.

            Aucun helper n'est nécessaire : la fenêtre est calculée à partir de
            l'horodatage du dernier événement du bouton. Ré-appuyer pendant la
            fenêtre la prolonge.
          default: 10
          selector:
            number:
              min: 3
              max: 120
              step: 1
              unit_of_measurement: s
              mode: slider

        kelvin_step:
          name: Pas de température par cran
          description: >
            Kelvin appliqués **par cran** de molette, multipliés par le nombre de
            crans du geste. Les bornes de la lampe sont respectées automatiquement.
          default: 150
          selector:
            number:
              min: 20
              max: 1000
              step: 10
              unit_of_measurement: K
              mode: slider

    # ─────────────────────────────────────────────────────
    section_advanced:
      name: 4️⃣ Avancé
      icon: mdi:cog
      collapsed: true
      input:
        dedup_threshold:
          name: Seuil anti-doublon
          description: >
            Deux événements du même canal séparés de moins que ce délai sont
            considérés comme un doublon Matter, et le second est ignoré.

            Ne pas descendre sous 10 ms sans raison : les doublons observés sont
            à 1-2 ms, mais la marge protège aussi contre la variabilité du réseau
            Thread. Ne pas monter au-dessus de ~200 ms non plus, sous peine
            d'avaler de vrais gestes rapprochés.
          default: 0.05
          selector:
            number:
              min: 0.005
              max: 0.5
              step: 0.005
              unit_of_measurement: s
              mode: box

        max_steps_per_event:
          name: Plafond de crans par geste
          description: >
            Borne haute appliquée au nombre de crans lu dans `multi_press_N`.
            Garde-fou contre une valeur aberrante qui ferait sauter la luminosité
            d'un extrême à l'autre. La valeur maximale observée en usage réel
            est 7.
          default: 10
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: slider

mode: queued
max: 15
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input button_scroll_up
    id: scroll_up
    alias: Rotation vers le haut

  - trigger: state
    entity_id: !input button_scroll_down
    id: scroll_down
    alias: Rotation vers le bas

  - trigger: state
    entity_id: !input button_click
    id: click
    alias: Clic molette

variables:
  v_light: !input light_target
  v_mode_button: !input button_mode
  v_brightness_step: !input brightness_step
  v_kelvin_step: !input kelvin_step
  v_kelvin_duration: !input kelvin_mode_duration
  v_dim_turns_on: !input dim_turns_on
  v_max_steps: !input max_steps_per_event
  # Doit être lié ici pour être lisible depuis `conditions:` — un `!input`
  # ne peut pas être référencé directement dans un template.
  v_dedup_threshold: !input dedup_threshold

  # Nombre de crans du geste, extrait de `multi_press_N`. Plafonné, et replié
  # sur 1 si l'attribut est absent ou illisible.
  v_steps: >
    {% set et = trigger.to_state.attributes.event_type | default('') %}
    {% set n = et | replace('multi_press_', '') | int(1) %}
    {{ [[n, 1] | max, v_max_steps] | min }}

  # Fenêtre Kelvin active ? Lue directement sur l'horodatage du bouton de
  # bascule — aucun helper d'état à maintenir.
  v_kelvin_mode: >
    {% set b = states(v_mode_button) %}
    {% if b in ['unknown', 'unavailable', none] %}
      false
    {% else %}
      {{ (as_timestamp(now()) - as_timestamp(b, 0)) < (v_kelvin_duration | float(10)) }}
    {% endif %}

conditions:
  # ── ANTI-DOUBLON ──────────────────────────────────────
  # L'intégration Matter émet chaque événement deux fois à 1-2 ms d'écart.
  # L'état d'une entité `event` EST l'horodatage de l'événement : comparer
  # l'ancien au nouveau isole le doublon de façon déterministe, sans dépendre
  # d'une course entre exécutions.
  # `from_state` est absent au tout premier déclenchement après un redémarrage :
  # dans ce cas on laisse passer.
  - condition: template
    alias: Ignorer le doublon Matter
    value_template: >
      {% set prev = trigger.from_state.state
                    if trigger.from_state is not none else none %}
      {% if prev in [none, 'unknown', 'unavailable'] %}
        true
      {% else %}
        {{ (as_timestamp(trigger.to_state.state, 0)
            - as_timestamp(prev, 0)) > (v_dedup_threshold | float(0.05)) }}
      {% endif %}

actions:
  - choose:
      # ── CLIC MOLETTE : allumer / éteindre ──────────────
      - conditions:
          - condition: trigger
            id: click
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_target
            alias: Basculer la lumière

      # ── ROTATION EN MODE KELVIN ────────────────────────
      # Placé AVANT la branche luminosité : `choose` retient la première
      # correspondance, donc le mode Kelvin a priorité pendant sa fenêtre.
      - conditions:
          - condition: trigger
            id:
              - scroll_up
              - scroll_down
          - condition: template
            value_template: "{{ v_kelvin_mode }}"
          - condition: state
            entity_id: !input light_target
            state: "on"
            alias: Une lampe éteinte n'a pas de température à ajuster
        sequence:
          - variables:
              # Bornes lues sur la lampe elle-même — jamais de valeur en dur.
              k_min: "{{ state_attr(v_light, 'min_color_temp_kelvin') | int(2000) }}"
              k_max: "{{ state_attr(v_light, 'max_color_temp_kelvin') | int(6500) }}"
              k_now: >
                {{ state_attr(v_light, 'color_temp_kelvin')
                   | int((state_attr(v_light, 'min_color_temp_kelvin') | int(2000)
                          + state_attr(v_light, 'max_color_temp_kelvin') | int(6500)) // 2) }}
              k_delta: >
                {{ (v_steps | int(1)) * (v_kelvin_step | int(150))
                   * (1 if trigger.id == 'scroll_up' else -1) }}
          - action: light.turn_on
            target:
              entity_id: !input light_target
            data:
              color_temp_kelvin: >
                {{ [[ (k_now | int) + (k_delta | int), k_min | int ] | max, k_max | int] | min }}
            alias: Ajuster la température, bornée à la plage de la lampe

      # ── ROTATION EN MODE LUMINOSITÉ (défaut) ───────────
      - conditions:
          - condition: trigger
            id:
              - scroll_up
              - scroll_down
          - condition: or
            conditions:
              - condition: state
                entity_id: !input light_target
                state: "on"
              - condition: template
                value_template: "{{ v_dim_turns_on }}"
            alias: Lampe allumée, ou rotation autorisée à l'allumer
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_target
            data:
              brightness_step_pct: >
                {{ (v_steps | int(1)) * (v_brightness_step | int(3))
                   * (1 if trigger.id == 'scroll_up' else -1) }}
            alias: Ajuster la luminosité, pas proportionnel au geste
