blueprint:
  name: Hue Tap Dial - Dimming Dynamique (Z2M / MQTT)
  description: >
    # 🎛️ Philips Hue Tap Dial — Dimming Dynamique via MQTT


    Blueprint maison pour piloter un **Philips Hue Tap Dial Switch** via Zigbee2MQTT,
    avec un **dimming dynamique à courbe cubique** : tourner doucement la molette
    ajuste finement la luminosité (≈6 %), un gros coup rapide l'envoie quasiment
    à fond (≈90-100 %).


    ## ✨ Pourquoi ce blueprint

    Les approches classiques (blueprints génériques, step fixe) saturent le réseau
    Zigbee quand on tourne vite : la lampe reçoit une rafale de commandes et laggue.
    Ici on lit directement `action_step_size` du message MQTT (la vitesse de rotation
    rapportée par la molette), on applique une **courbe cubique** et on envoie un
    seul `brightness_step_pct` avec `transition: 0`. Résultat : fluide, granulaire,
    sans lag.


    ## 🔧 Fonctions

    - **Molette** : dim dynamique de la lampe sélectionnée (courbe cubique réglable)

    - **Sélection de lampe** : un bouton bascule entre 2 lampes (via un `input_select`)

    - **Boutons** : 4 boutons configurables (court + long) avec actions personnalisées

    - **Retour auto** : un `input_text` ramène le contexte molette par défaut


    ## 📋 Prérequis

    - Philips Hue Tap Dial Switch (RDM002) appairé dans **Zigbee2MQTT**

    - Un helper `input_select` listant les 2 lampes (ex. options "Plafond", "Armoire")

    - Un helper `input_text` pour le suivi du dernier bouton pressé

    - Home Assistant 2024.10.0 ou plus récent

  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/local/tap-dial-dynamic-dimming

  input:
    # ──────────────────────────────────────────────────────────────
    section_mqtt:
      name: 1️⃣ Connexion Zigbee2MQTT
      icon: mdi:zigbee
      input:
        z2m_topic:
          name: Topic MQTT de la télécommande
          description: >
            Topic Z2M complet de la télécommande, généralement
            `zigbee2mqtt/<Nom de la télécommande>`.
            Exemple : `zigbee2mqtt/Chambre-Telecommande-Porte`
          selector:
            text:

    # ──────────────────────────────────────────────────────────────
    section_dimming:
      name: 2️⃣ Molette — Dimming dynamique
      icon: mdi:knob
      input:
        light_selector:
          name: Sélecteur de lampe (input_select)
          description: >
            Helper `input_select` à 2 options qui détermine quelle lampe la molette
            contrôle. Les noms des 2 options doivent correspondre exactement aux
            valeurs saisies plus bas (Option A / Option B).
          selector:
            entity:
              filter:
                - domain: input_select

        light_option_a_name:
          name: Option A — Nom dans l'input_select
          description: Le nom EXACT de la 1ʳᵉ option (sensible à la casse).
          default: "Chambre-Plafond"
          selector:
            text:

        light_option_a_entity:
          name: Option A — Lampe contrôlée
          description: La lampe à piloter quand l'option A est sélectionnée.
          selector:
            entity:
              filter:
                - domain: light

        light_option_a_max:
          name: Option A — Puissance max de la courbe
          description: >
            Amplitude maximale du dimming pour cette lampe (plus haut = plus sensible
            sur les gros coups). 110 = un gros coup atteint ~100 %. Baisser pour
            une lampe qu'on veut garder plus douce.
          default: 110
          selector:
            number:
              min: 50
              max: 200
              step: 5
              mode: slider

        light_option_a_min:
          name: Option A — Pas minimum
          description: Pas minimum garanti sur un tout petit cran lent (en %).
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        light_option_b_name:
          name: Option B — Nom dans l'input_select
          description: Le nom EXACT de la 2ᵉ option (sensible à la casse).
          default: "Chambre-Armoire"
          selector:
            text:

        light_option_b_entity:
          name: Option B — Lampe contrôlée
          description: La lampe à piloter quand l'option B est sélectionnée.
          selector:
            entity:
              filter:
                - domain: light

        light_option_b_max:
          name: Option B — Puissance max de la courbe
          description: >
            Amplitude maximale du dimming pour la lampe B. Mettre plus haut qu'A si
            cette lampe doit être plus réactive (utile pour un ruban LED plus lent).
          default: 130
          selector:
            number:
              min: 50
              max: 200
              step: 5
              mode: slider

        light_option_b_min:
          name: Option B — Pas minimum
          description: Pas minimum garanti sur un tout petit cran lent (en %).
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        step_normalize:
          name: Normalisation du step_size
          description: >
            Valeur de `action_step_size` considérée comme « gros coup » maximal.
            La molette Hue rapporte généralement jusqu'à ~100-150 par message.
            100 est un bon défaut. Baisser = plus sensible globalement.
          default: 100
          selector:
            number:
              min: 50
              max: 255
              step: 5
              mode: slider

        action_on_rotate:
          name: Action supplémentaire à chaque rotation
          description: >
            Action(s) optionnelle(s) exécutée(s) à CHAQUE cran de molette, en plus
            du dimming. Typiquement : activer un `input_boolean` de bypass manuel
            pour empêcher un capteur de mouvement de reprendre la main pendant
            qu'on ajuste la lumière. Laisser vide pour ne rien faire de plus.
          default: []
          selector:
            action:

    # ──────────────────────────────────────────────────────────────
    section_button_1:
      name: 3️⃣ Bouton 1
      icon: mdi:numeric-1-circle-outline
      input:
        button_1_short:
          name: Bouton 1 — Appui court
          description: >
            Action sur appui court. Par défaut on y met `input_select.select_next`
            pour basculer la lampe contrôlée par la molette.
          default: []
          selector:
            action:
        button_1_long:
          name: Bouton 1 — Appui long
          description: Action sur appui long.
          default: []
          selector:
            action:

    section_button_2:
      name: 4️⃣ Bouton 2
      icon: mdi:numeric-2-circle-outline
      input:
        button_2_short:
          name: Bouton 2 — Appui court
          default: []
          selector:
            action:
        button_2_long:
          name: Bouton 2 — Appui long
          default: []
          selector:
            action:

    section_button_3:
      name: 5️⃣ Bouton 3
      icon: mdi:numeric-3-circle-outline
      input:
        button_3_short:
          name: Bouton 3 — Appui court
          default: []
          selector:
            action:
        button_3_long:
          name: Bouton 3 — Appui long
          default: []
          selector:
            action:

    section_button_4:
      name: 6️⃣ Bouton 4
      icon: mdi:numeric-4-circle-outline
      input:
        button_4_short:
          name: Bouton 4 — Appui court
          default: []
          selector:
            action:
        button_4_long:
          name: Bouton 4 — Appui long
          default: []
          selector:
            action:

    # ──────────────────────────────────────────────────────────────
    section_context:
      name: 7️⃣ Avancé — Suivi de contexte
      icon: mdi:cog
      collapsed: true
      input:
        last_pressed:
          name: Helper de suivi (input_text)
          description: >
            Helper `input_text` optionnel pour suivre le dernier bouton pressé.
            Laissé tel quel par ce blueprint pour compatibilité ; les boutons
            peuvent le remettre à "1" via leurs propres actions si besoin.
          default: []
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 10

trigger:
  - platform: mqtt
    topic: !input z2m_topic

variables:
  # Inputs accessibles dans les templates
  opt_a_name: !input light_option_a_name
  opt_a_entity: !input light_option_a_entity
  opt_a_max: !input light_option_a_max
  opt_a_min: !input light_option_a_min
  opt_b_name: !input light_option_b_name
  opt_b_entity: !input light_option_b_entity
  opt_b_max: !input light_option_b_max
  opt_b_min: !input light_option_b_min
  selector_entity: !input light_selector
  normalize: !input step_normalize
  # Calculs molette
  act: "{{ trigger.payload_json.action | default('') }}"
  raw_step: "{{ trigger.payload_json.action_step_size | int(0) }}"
  direction: "{{ 'up' if act == 'brightness_step_up' else 'down' }}"
  selected: "{{ states(selector_entity) }}"
  light_entity: "{{ opt_a_entity if selected == opt_a_name else opt_b_entity }}"
  max_pct: "{{ opt_a_max if selected == opt_a_name else opt_b_max }}"
  min_step: "{{ opt_a_min if selected == opt_a_name else opt_b_min }}"
  norm: "{{ ([raw_step, normalize | int] | min) / (normalize | int) }}"
  # Courbe CUBIQUE : douce en bas, forte en haut, capée à 100
  computed_step: >
    {{ [ [ (norm | float * norm | float * norm | float * max_pct | float) | round(0) | int, 100 ] | min, min_step | int ] | max }}
  signed_step: "{{ computed_step if direction == 'up' else (computed_step * -1) }}"

action:
  - choose:
      # ── MOLETTE : dimming dynamique ───────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ signed_step }}"
              transition: 0
          - alias: Action supplémentaire optionnelle sur rotation
            sequence: !input action_on_rotate

      # ── BOUTON 1 ──────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_press_release' }}"
        sequence: !input button_1_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_hold_release' }}"
        sequence: !input button_1_long

      # ── BOUTON 2 ──────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_press_release' }}"
        sequence: !input button_2_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_hold_release' }}"
        sequence: !input button_2_long

      # ── BOUTON 3 ──────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_press_release' }}"
        sequence: !input button_3_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_hold_release' }}"
        sequence: !input button_3_long

      # ── BOUTON 4 ──────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_press_release' }}"
        sequence: !input button_4_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_hold_release' }}"
        sequence: !input button_4_long
