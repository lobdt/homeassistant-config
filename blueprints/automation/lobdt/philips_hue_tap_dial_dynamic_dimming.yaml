# =============================================================================
#  Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT)
#  Version : 2.3.0  —  07/08/2026
#
#  CHANGELOG
#  2.3.0 - La Lampe 2 n'est plus pilotee par un PAS divise, mais par une
#          POSITION ABSOLUE derivee de la Lampe 1.
#          Motif : Home Assistant convertit brightness_step_pct en ENTIER.
#          Un pas divise par le coefficient (ex: 2 / 7 = 0.29) etait arrondi
#          a 0 ou 1, ce qui detruisait le ratio sur tous les petits gestes
#          (mesure terrain : ratio effectif 2 au lieu de 7) et accumulait
#          l'erreur cran apres cran.
#          Desormais : niveau_vise_L1 = niveau_actuel_L1 + pas ; puis
#          cible_L2 = niveau_vise_L1 / coefficient, envoyee en absolu.
#          Le ratio est recalcule a chaque rotation depuis l'etat reel, donc
#          aucune derive cumulative possible, a toutes les vitesses.
#          Corollaire : le "pas minimum" de la Lampe 2 disparait (elle ne
#          fait plus de pas). La Lampe 1 garde min/max inchanges.
#  2.2.0 - Introduction du coefficient de ratio (division du pas) —
#          remplace en 2.3.0, l'arrondi entier de HA le rendait inoperant.
#  2.1.0 - Elargissement des plages min/max (obsolete depuis 2.2.0).
#  2.0.0 - Support multi-lampes, fix depart a 0%, robustesse unavailable.
#  1.0.0 - Version initiale : dimming cubique, 2 options mono-lampe.
#
#  NOTE Adaptive Lighting : si AL pilote une lampe controlee ici, activer
#  "adapt_only_on_bare_turn_on" sur l'instance AL correspondante. Sinon AL
#  reecrit la luminosite juste apres chaque commande de la molette, meme
#  quand "intercept" est desactive.
# =============================================================================
blueprint:
  name: Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT) v2.3.0
  description: >
    # 🎛️ Philips Hue Tap Dial — Dimming Dynamique via MQTT

    **Version 2.3.0**

    Blueprint maison pour piloter un **Philips Hue Tap Dial Switch** via
    Zigbee2MQTT, avec un **dimming dynamique à courbe cubique**.

    ## ✨ Fonctions clés
    - **Multi-lampes proportionnel** : l'option B pilote 1 ou 2 lampes. La
      Lampe 1 est la référence (pas relatif, min/max calibrés). La Lampe 2
      suit en **position absolue**, toujours à `niveau L1 / coefficient`.
    - **Départ à 0 %** : une lampe éteinte démarre au premier cran depuis 0.

    ## 🧠 Stratégie de dimming
    - **Lampe 1 / Option A** — allumée → `brightness_step_pct` relatif (la
      lampe calcule elle-même : pas de latence, pas de saturation Zigbee).
      Éteinte + rotation ↑ → `brightness_pct` absolu, départ à 0.
    - **Lampe 2** — toujours en `brightness_pct` **absolu**, recalculé à
      chaque rotation depuis le niveau visé de la Lampe 1. Aucun pas relatif,
      donc aucune dérive d'arrondi cumulative.
    - Rotation ↓ amenant sous 0 % → extinction. Lampe indisponible → ignorée.

    ## 📐 Calibrer deux lampes de puissances différentes
    Allumer les deux lampes, chercher le pourcentage de chacune qui donne le
    même rendu visuel, et diviser : X % Lampe 1 = Y % Lampe 2 → coefficient
    = X / Y. Exemple mesuré : 7 % Armoire ≈ 1 % KAJPLATS → coefficient 7.

    ## ⚠️ Limite matérielle assumée
    Les lampes résolvent la luminosité par paliers d'environ 0,4 %. Sur un
    micro-geste, la Lampe 2 peut donc ne pas bouger visuellement alors que la
    Lampe 1 bouge. Le ratio reste exact : c'est l'affichage qui ne peut pas
    être plus fin.

    ## ⚠️ Adaptive Lighting
    Si Adaptive Lighting pilote une des lampes, activer
    **`adapt_only_on_bare_turn_on`** sur l'instance AL concernée — sinon AL
    réécrit la luminosité juste après chaque commande de la molette, même si
    `intercept` est désactivé (deux mécanismes distincts).

    ## 📋 Prérequis
    - Philips Hue Tap Dial Switch (RDM002) appairé dans **Zigbee2MQTT**
    - Un helper `input_select` à 2 options
    - Home Assistant 2024.10.0 ou plus récent
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config/blob/main/blueprints/automation/lobdt/philips_hue_tap_dial_dynamic_dimming.yaml

  input:
    section_mqtt:
      name: 1️⃣ Connexion Zigbee2MQTT
      icon: mdi:zigbee
      input:
        z2m_topic:
          name: Topic MQTT de la télécommande
          description: >
            Topic Z2M complet, généralement `zigbee2mqtt/<Nom de la télécommande>`.
          selector:
            text:

    section_dimming:
      name: 2️⃣ Molette — Dimming dynamique
      icon: mdi:knob
      input:
        light_selector:
          name: Sélecteur de lampe (input_select)
          description: >
            Helper `input_select` à 2 options. Les noms doivent correspondre
            EXACTEMENT aux valeurs saisies ci-dessous.
          selector:
            entity:
              filter:
                - domain: input_select

        light_option_a_name:
          name: Option A — Nom dans l'input_select
          default: "Chambre-Plafond"
          selector:
            text:
        light_option_a_entity:
          name: Option A — Lampe contrôlée
          selector:
            entity:
              filter:
                - domain: light
        light_option_a_max:
          name: Option A — Puissance max de la courbe
          description: >
            Amplitude maximale du dimming (plus haut = plus sensible sur les
            gros coups). 110 = un gros coup atteint ~100 %.
          default: 110
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_a_min:
          name: Option A — Pas minimum
          description: Pas minimum garanti sur un tout petit cran lent (en %).
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        light_option_b_name:
          name: Option B — Nom dans l'input_select
          default: "Chambre-Ambiance"
          selector:
            text:

        light_option_b1_entity:
          name: Option B — Lampe 1 (référence, obligatoire)
          description: >
            Lampe de référence. Elle est pilotée normalement ; la Lampe 2 se
            cale sur elle via le coefficient.
          selector:
            entity:
              filter:
                - domain: light
        light_option_b1_max:
          name: Option B — Lampe 1 — Puissance max de la courbe
          default: 130
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_b1_min:
          name: Option B — Lampe 1 — Pas minimum
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        light_option_b2_entity:
          name: Option B — Lampe 2 (optionnelle)
          description: >
            Deuxième lampe du slot B. Laisser vide si une seule lampe suffit.
            Elle n'a ni min ni max : sa luminosité est toujours celle de la
            Lampe 1 divisée par le coefficient ci-dessous.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        light_option_b2_ratio:
          name: Option B — Lampe 2 — Coefficient par rapport à la Lampe 1
          description: >
            Combien de fois la Lampe 2 est plus lumineuse que la Lampe 1, à
            % égal. Mesure : allumer les 2, ajuster jusqu'à rendu visuel
            équivalent, diviser % Lampe 1 par % Lampe 2. Exemple : 7 % / 1 %
            → coefficient 7.
          default: 7
          selector:
            number:
              min: 0.1
              max: 50
              step: 0.1
              mode: slider

        step_normalize:
          name: Normalisation du step_size
          description: >
            Valeur de `action_step_size` considérée comme « gros coup »
            maximal. 100 est un bon défaut. Baisser = plus sensible.
          default: 100
          selector:
            number:
              min: 50
              max: 255
              step: 5
              mode: slider

        action_on_rotate:
          name: Action supplémentaire à chaque rotation
          description: >
            Action(s) optionnelle(s) exécutée(s) à CHAQUE cran de molette.
            Typiquement : activer un `input_boolean` de bypass manuel.
          default: []
          selector:
            action:

    section_button_1:
      name: 3️⃣ Bouton 1
      icon: mdi:numeric-1-circle-outline
      input:
        button_1_short:
          name: Bouton 1 — Appui court
          default: []
          selector:
            action:
        button_1_long:
          name: Bouton 1 — Appui long
          default: []
          selector:
            action:

    section_button_2:
      name: 4️⃣ Bouton 2
      icon: mdi:numeric-2-circle-outline
      input:
        button_2_short:
          name: Bouton 2 — Appui court
          default: []
          selector:
            action:
        button_2_long:
          name: Bouton 2 — Appui long
          default: []
          selector:
            action:

    section_button_3:
      name: 5️⃣ Bouton 3
      icon: mdi:numeric-3-circle-outline
      input:
        button_3_short:
          name: Bouton 3 — Appui court
          default: []
          selector:
            action:
        button_3_long:
          name: Bouton 3 — Appui long
          default: []
          selector:
            action:

    section_button_4:
      name: 6️⃣ Bouton 4
      icon: mdi:numeric-4-circle-outline
      input:
        button_4_short:
          name: Bouton 4 — Appui court
          default: []
          selector:
            action:
        button_4_long:
          name: Bouton 4 — Appui long
          default: []
          selector:
            action:

    section_context:
      name: 7️⃣ Avancé — Suivi de contexte
      icon: mdi:cog
      collapsed: true
      input:
        last_pressed:
          name: Helper de suivi (input_text)
          default: []
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 10

trigger:
  - platform: mqtt
    topic: !input z2m_topic

variables:
  opt_a_name: !input light_option_a_name
  opt_a_entity: !input light_option_a_entity
  opt_a_min: !input light_option_a_min
  opt_a_max: !input light_option_a_max

  opt_b_name: !input light_option_b_name
  opt_b1_entity: !input light_option_b1_entity
  opt_b1_min: !input light_option_b1_min
  opt_b1_max: !input light_option_b1_max
  opt_b2_entity: !input light_option_b2_entity
  opt_b2_ratio: !input light_option_b2_ratio

  selector_entity: !input light_selector
  normalize: !input step_normalize

  act: "{{ trigger.payload_json.action | default('') }}"
  raw_step: "{{ trigger.payload_json.action_step_size | int(0) }}"
  direction: "{{ 'up' if act == 'brightness_step_up' else 'down' }}"
  selected: "{{ states(selector_entity) }}"
  norm: "{{ ([raw_step, normalize | int] | min) / (normalize | int) }}"

  # ── Lampe de référence : Option A seule, ou Lampe 1 si Option B ────
  ref_entity: "{{ opt_a_entity if selected == opt_a_name else opt_b1_entity }}"
  ref_min: "{{ opt_a_min if selected == opt_a_name else opt_b1_min }}"
  ref_max: "{{ opt_a_max if selected == opt_a_name else opt_b1_max }}"
  ref_state: "{{ states(ref_entity) }}"
  ref_off: "{{ ref_state == 'off' }}"

  # Pas de la référence (entier : HA arrondit de toute façon)
  ref_step: >
    {{ [ [ (((norm | float) ** 3) * (ref_max | float)) | round(0) | int, 100 ] | min, ref_min | int ] | max }}
  ref_signed: "{{ ref_step if direction == 'up' else (ref_step * -1) }}"

  # Niveau actuel de la référence, en % (0 si éteinte)
  ref_current_pct: >
    {{ 0 if ref_off else ((state_attr(ref_entity, 'brightness') | default(0) | int) / 255 * 100) }}

  # Niveau que la référence va atteindre après ce cran
  ref_target_pct: >
    {{ [ [ (ref_current_pct | float) + (ref_signed | int), 0 ] | max, 100 ] | min }}

  # Cible ABSOLUE de la Lampe 2, dérivée du niveau visé de la référence
  l2_target_pct: >
    {{ ((ref_target_pct | float) / (opt_b2_ratio | float)) | round(0) | int }}

  # La Lampe 2 est-elle concernée par cette rotation ?
  l2_active: >
    {{ selected != opt_a_name and opt_b2_entity and states(opt_b2_entity) in ['on', 'off'] }}

action:
  - choose:
      # ── MOLETTE ──────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          # ── Lampe de référence ────────────────────────────────────
          - choose:
              # Éteinte + rotation ↑ → départ absolu depuis 0 %
              - conditions:
                  - condition: template
                    value_template: "{{ ref_off and direction == 'up' and ref_state in ['on','off'] }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ ref_entity }}"
                    data:
                      brightness_pct: "{{ ref_step }}"
                      transition: 0
              # Allumée → pas relatif (rapide, sans latence)
              - conditions:
                  - condition: template
                    value_template: "{{ not ref_off and ref_state in ['on','off'] }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ ref_entity }}"
                    data:
                      brightness_step_pct: "{{ ref_signed }}"
                      transition: 0
            # Éteinte + rotation ↓ → aucune branche : reste éteinte

          # ── Lampe 2 : position absolue proportionnelle ─────────────
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ l2_active and l2_target_pct > 0 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ opt_b2_entity }}"
                    data:
                      brightness_pct: "{{ l2_target_pct }}"
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ l2_active and l2_target_pct <= 0 and states(opt_b2_entity) == 'on' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ opt_b2_entity }}"

          - alias: Action supplémentaire optionnelle sur rotation
            sequence: !input action_on_rotate

      # ── BOUTONS 1-4 ──────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_press_release' }}"
        sequence: !input button_1_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_hold_release' }}"
        sequence: !input button_1_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_press_release' }}"
        sequence: !input button_2_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_hold_release' }}"
        sequence: !input button_2_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_press_release' }}"
        sequence: !input button_3_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_hold_release' }}"
        sequence: !input button_3_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_press_release' }}"
        sequence: !input button_4_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_hold_release' }}"
        sequence: !input button_4_long
