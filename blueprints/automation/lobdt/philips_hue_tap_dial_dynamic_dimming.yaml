# =============================================================================
#  Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT)
#  Version : 2.4.0  —  07/08/2026
#
#  CHANGELOG
#  2.4.0 - Remplacement du ratio/diviseur par un MULTIPLICATEUR + un SEUIL BAS,
#          tous deux ajustables via l'UI.
#          Motif : mesures terrain sur 3 points (Armoire/Meuble) :
#            7% / 1%   -> ratio 7.0
#            25% / 20% -> ratio 1.25
#            50% / 40% -> ratio 1.25
#          Les points 25% et 50% concordent parfaitement (relation lineaire,
#          Meuble = Armoire x 0.8), seul le point bas (7%) decroche : typique
#          d'une LED dans ses tout premiers pourcents. Plutot que de forcer
#          un ratio unique fautif sur toute la plage, ou de batir un systeme
#          a N paliers non calibres, on isole les deux comportements reels :
#          - En dessous du seuil bas : Lampe 2 eteinte (pas de ratio fiable).
#          - Au-dessus : Lampe 2 = Lampe 1 x multiplicateur (lineaire, valide
#            par 2 mesures concordantes).
#          Champs `light_option_b2_multiplier` (defaut 0.8) et
#          `light_option_b2_low_threshold` (defaut 10) exposes dans l'UI.
#  2.3.0 - Lampe 2 pilotee en position absolue derivee de la Lampe 1 (fix de
#          l'arrondi entier qui cassait un ratio/pas divise).
#  2.2.0 - Introduction du ratio (obsolete, remplace en 2.4.0).
#  2.1.0 - Elargissement des plages min/max (obsolete depuis 2.2.0).
#  2.0.0 - Support multi-lampes, fix depart a 0%, robustesse unavailable.
#  1.0.0 - Version initiale : dimming cubique, 2 options mono-lampe.
#
#  NOTE Adaptive Lighting : si AL pilote une lampe controlee ici, activer
#  "adapt_only_on_bare_turn_on" sur l'instance AL correspondante. Sinon AL
#  reecrit la luminosite juste apres chaque commande de la molette, meme
#  quand "intercept" est desactive.
# =============================================================================
blueprint:
  name: Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT) v2.4.0
  description: >
    # 🎛️ Philips Hue Tap Dial — Dimming Dynamique via MQTT

    **Version 2.4.0**

    Blueprint maison pour piloter un **Philips Hue Tap Dial Switch** via
    Zigbee2MQTT, avec un **dimming dynamique à courbe cubique**.

    ## ✨ Fonctions clés
    - **Multi-lampes proportionnel** : l'option B pilote 1 ou 2 lampes. La
      Lampe 1 est la référence (pas relatif, min/max calibrés). La Lampe 2
      suit en **position absolue** : `niveau L1 × multiplicateur`, sauf sous
      un seuil bas où elle reste éteinte.
    - **Départ à 0 %** : une lampe éteinte démarre au premier cran depuis 0.

    ## 🧠 Stratégie de dimming
    - **Lampe 1 / Option A** — allumée → `brightness_step_pct` relatif.
      Éteinte + rotation ↑ → `brightness_pct` absolu, départ à 0.
    - **Lampe 2** — toujours en `brightness_pct` absolu, recalculé à chaque
      rotation depuis le niveau visé de la Lampe 1 :
      - Si niveau visé < seuil bas → Lampe 2 éteinte.
      - Sinon → Lampe 2 = niveau visé × multiplicateur.
    - Rotation ↓ amenant sous 0 % → extinction. Lampe indisponible → ignorée.

    ## 📐 Calibrer deux lampes de puissances différentes
    Allumer les deux lampes à plusieurs niveaux (ex. 25 % et 50 % sur la
    Lampe 1), régler la Lampe 2 au même rendu visuel à chaque fois, et
    calculer % Lampe 2 / % Lampe 1. Si le ratio est stable sur la plage utile
    (comme observé ici : 0.8 entre 25 % et 50 %), c'est le multiplicateur.
    Le point où le ratio décroche fortement (souvent < 10-15 %) donne le
    seuil bas.

    ## ⚠️ Adaptive Lighting
    Si Adaptive Lighting pilote une des lampes, activer
    **`adapt_only_on_bare_turn_on`** sur l'instance AL concernée.

    ## 📋 Prérequis
    - Philips Hue Tap Dial Switch (RDM002) appairé dans **Zigbee2MQTT**
    - Un helper `input_select` à 2 options
    - Home Assistant 2024.10.0 ou plus récent
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config/blob/main/blueprints/automation/lobdt/philips_hue_tap_dial_dynamic_dimming.yaml

  input:
    section_mqtt:
      name: 1️⃣ Connexion Zigbee2MQTT
      icon: mdi:zigbee
      input:
        z2m_topic:
          name: Topic MQTT de la télécommande
          description: >
            Topic Z2M complet, généralement `zigbee2mqtt/<Nom de la télécommande>`.
          selector:
            text:

    section_dimming:
      name: 2️⃣ Molette — Dimming dynamique
      icon: mdi:knob
      input:
        light_selector:
          name: Sélecteur de lampe (input_select)
          description: >
            Helper `input_select` à 2 options. Les noms doivent correspondre
            EXACTEMENT aux valeurs saisies ci-dessous.
          selector:
            entity:
              filter:
                - domain: input_select

        light_option_a_name:
          name: Option A — Nom dans l'input_select
          default: "Chambre-Plafond"
          selector:
            text:
        light_option_a_entity:
          name: Option A — Lampe contrôlée
          selector:
            entity:
              filter:
                - domain: light
        light_option_a_max:
          name: Option A — Puissance max de la courbe
          default: 110
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_a_min:
          name: Option A — Pas minimum
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        light_option_b_name:
          name: Option B — Nom dans l'input_select
          default: "Chambre-Ambiance"
          selector:
            text:

        light_option_b1_entity:
          name: Option B — Lampe 1 (référence, obligatoire)
          selector:
            entity:
              filter:
                - domain: light
        light_option_b1_max:
          name: Option B — Lampe 1 — Puissance max de la courbe
          default: 130
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_b1_min:
          name: Option B — Lampe 1 — Pas minimum
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: slider

        light_option_b2_entity:
          name: Option B — Lampe 2 (optionnelle)
          description: >
            Deuxième lampe du slot B. Laisser vide si une seule lampe suffit.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        light_option_b2_multiplier:
          name: Option B — Lampe 2 — Multiplicateur
          description: >
            Niveau de la Lampe 2 = niveau visé de la Lampe 1 × ce nombre.
            Exemple mesuré : Armoire 25 % ↔ Meuble 20 % → 0.8.
          default: 0.8
          selector:
            number:
              min: 0.05
              max: 5
              step: 0.05
              mode: slider
        light_option_b2_low_threshold:
          name: Option B — Lampe 2 — Seuil bas (% de la Lampe 1)
          description: >
            En dessous de ce niveau sur la Lampe 1, la Lampe 2 reste éteinte
            plutôt que de suivre le multiplicateur (souvent faux tout en bas
            de plage). Mettre à 0 pour désactiver ce seuil.
          default: 10
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider

        step_normalize:
          name: Normalisation du step_size
          default: 100
          selector:
            number:
              min: 50
              max: 255
              step: 5
              mode: slider

        action_on_rotate:
          name: Action supplémentaire à chaque rotation
          default: []
          selector:
            action:

    section_button_1:
      name: 3️⃣ Bouton 1
      icon: mdi:numeric-1-circle-outline
      input:
        button_1_short:
          name: Bouton 1 — Appui court
          default: []
          selector:
            action:
        button_1_long:
          name: Bouton 1 — Appui long
          default: []
          selector:
            action:

    section_button_2:
      name: 4️⃣ Bouton 2
      icon: mdi:numeric-2-circle-outline
      input:
        button_2_short:
          name: Bouton 2 — Appui court
          default: []
          selector:
            action:
        button_2_long:
          name: Bouton 2 — Appui long
          default: []
          selector:
            action:

    section_button_3:
      name: 5️⃣ Bouton 3
      icon: mdi:numeric-3-circle-outline
      input:
        button_3_short:
          name: Bouton 3 — Appui court
          default: []
          selector:
            action:
        button_3_long:
          name: Bouton 3 — Appui long
          default: []
          selector:
            action:

    section_button_4:
      name: 6️⃣ Bouton 4
      icon: mdi:numeric-4-circle-outline
      input:
        button_4_short:
          name: Bouton 4 — Appui court
          default: []
          selector:
            action:
        button_4_long:
          name: Bouton 4 — Appui long
          default: []
          selector:
            action:

    section_context:
      name: 7️⃣ Avancé — Suivi de contexte
      icon: mdi:cog
      collapsed: true
      input:
        last_pressed:
          name: Helper de suivi (input_text)
          default: []
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 10

trigger:
  - platform: mqtt
    topic: !input z2m_topic

variables:
  opt_a_name: !input light_option_a_name
  opt_a_entity: !input light_option_a_entity
  opt_a_min: !input light_option_a_min
  opt_a_max: !input light_option_a_max

  opt_b_name: !input light_option_b_name
  opt_b1_entity: !input light_option_b1_entity
  opt_b1_min: !input light_option_b1_min
  opt_b1_max: !input light_option_b1_max
  opt_b2_entity: !input light_option_b2_entity
  opt_b2_multiplier: !input light_option_b2_multiplier
  opt_b2_low_threshold: !input light_option_b2_low_threshold

  selector_entity: !input light_selector
  normalize: !input step_normalize

  act: "{{ trigger.payload_json.action | default('') }}"
  raw_step: "{{ trigger.payload_json.action_step_size | int(0) }}"
  direction: "{{ 'up' if act == 'brightness_step_up' else 'down' }}"
  selected: "{{ states(selector_entity) }}"
  norm: "{{ ([raw_step, normalize | int] | min) / (normalize | int) }}"

  ref_entity: "{{ opt_a_entity if selected == opt_a_name else opt_b1_entity }}"
  ref_min: "{{ opt_a_min if selected == opt_a_name else opt_b1_min }}"
  ref_max: "{{ opt_a_max if selected == opt_a_name else opt_b1_max }}"
  ref_state: "{{ states(ref_entity) }}"
  ref_off: "{{ ref_state == 'off' }}"

  ref_step: >
    {{ [ [ (((norm | float) ** 3) * (ref_max | float)) | round(0) | int, 100 ] | min, ref_min | int ] | max }}
  ref_signed: "{{ ref_step if direction == 'up' else (ref_step * -1) }}"

  ref_current_pct: >
    {{ 0 if ref_off else ((state_attr(ref_entity, 'brightness') | default(0) | int) / 255 * 100) }}

  ref_target_pct: >
    {{ [ [ (ref_current_pct | float) + (ref_signed | int), 0 ] | max, 100 ] | min }}

  # ── Lampe 2 : seuil bas puis multiplicateur linéaire ────────────
  l2_target_pct: >
    {% if (ref_target_pct | float) < (opt_b2_low_threshold | float) %}
      0
    {% else %}
      {{ ((ref_target_pct | float) * (opt_b2_multiplier | float)) | round(0) | int }}
    {% endif %}

  l2_active: >
    {{ selected != opt_a_name and opt_b2_entity and states(opt_b2_entity) in ['on', 'off'] }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ ref_off and direction == 'up' and ref_state in ['on','off'] }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ ref_entity }}"
                    data:
                      brightness_pct: "{{ ref_step }}"
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ not ref_off and ref_state in ['on','off'] }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ ref_entity }}"
                    data:
                      brightness_step_pct: "{{ ref_signed }}"
                      transition: 0

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ l2_active and (l2_target_pct | int) > 0 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ opt_b2_entity }}"
                    data:
                      brightness_pct: "{{ l2_target_pct }}"
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ l2_active and (l2_target_pct | int) <= 0 and states(opt_b2_entity) == 'on' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ opt_b2_entity }}"

          - alias: Action supplémentaire optionnelle sur rotation
            sequence: !input action_on_rotate

      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_press_release' }}"
        sequence: !input button_1_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_hold_release' }}"
        sequence: !input button_1_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_press_release' }}"
        sequence: !input button_2_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_hold_release' }}"
        sequence: !input button_2_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_press_release' }}"
        sequence: !input button_3_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_hold_release' }}"
        sequence: !input button_3_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_press_release' }}"
        sequence: !input button_4_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_hold_release' }}"
        sequence: !input button_4_long
