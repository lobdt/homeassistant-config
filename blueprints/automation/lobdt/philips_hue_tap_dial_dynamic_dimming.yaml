# =============================================================================
#  Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT)
#  Version : 2.2.0  —  07/08/2026
#
#  CHANGELOG
#  2.2.0 - Remplacement de min/max independants pour la Lampe 2 par un
#          UNIQUE coefficient de ratio par rapport a la Lampe 1 (reference).
#          Motif : calibrer min et max separement sur la Lampe 2 ne garantit
#          pas un ratio constant sur toute la course de la molette (mesure
#          terrain : max correctement calibre a x6.8, mais min derive a x4).
#          Avec un coefficient unique, le ratio mesure (ex: x7) s'applique
#          identiquement du plus petit cran au plus gros, sans risque de
#          derive entre les deux bouts de la courbe.
#          Limite physique assumee : si le pas derive tombe sous la
#          resolution de la lampe (~0.4 %), elle peut ne pas bouger sur un
#          micro-geste. Comportement honnete, pas un defaut du blueprint.
#  2.1.0 - Elargissement des plages de calibration min/max (retire en 2.2.0
#          au profit du coefficient, conserve ici pour historique).
#  2.0.0 - Support multi-lampes sur l'option B, fix depart a 0%, robustesse
#          lampes unavailable.
#  1.0.0 - Version initiale : dimming cubique, 2 options mono-lampe.
#
#  NOTE Adaptive Lighting : si AL pilote une lampe controlee ici, activer
#  "adapt_only_on_bare_turn_on" sur l'instance AL correspondante. Sinon AL
#  reecrit la luminosite juste apres chaque commande de la molette, meme
#  quand "intercept" est desactive.
# =============================================================================
blueprint:
  name: Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT) v2.2.0
  description: >
    # 🎛️ Philips Hue Tap Dial — Dimming Dynamique via MQTT

    **Version 2.2.0**

    Blueprint maison pour piloter un **Philips Hue Tap Dial Switch** via
    Zigbee2MQTT, avec un **dimming dynamique à courbe cubique**.

    ## ✨ Fonctions clés
    - **Multi-lampes** : l'option B pilote 1 ou 2 lampes. La Lampe 1 est la
      référence (min/max calibrés normalement). La Lampe 2, si présente, suit
      la Lampe 1 via un **coefficient de ratio unique** — pas de min/max
      séparés à maintenir cohérents.
    - **Départ à 0 %** : une lampe éteinte démarre au premier cran depuis 0.

    ## 🧠 Stratégie de dimming
    - Lampe **allumée** → `brightness_step_pct` relatif (pas de latence).
    - Lampe **éteinte** + rotation ↑ → `brightness_pct` absolu, départ à 0.
    - Lampe **éteinte** + rotation ↓ → aucune action.
    - Lampe **indisponible** → ignorée.

    ## 📐 Calibrer deux lampes de puissances différentes
    Allumer les deux lampes, chercher le pourcentage de chacune qui donne le
    même rendu visuel, et diviser : X % Lampe 1 = Y % Lampe 2 → coefficient
    = X / Y. Exemple mesuré : 7 % Armoire ≈ 1 % KAJPLATS → coefficient = 7.
    Ce seul chiffre remplace le calibrage séparé du min et du max de la
    Lampe 2 — le ratio reste juste à n'importe quelle vitesse de rotation.

    ## ⚠️ Adaptive Lighting
    Si Adaptive Lighting pilote une des lampes, activer
    **`adapt_only_on_bare_turn_on`** sur l'instance AL concernée — sinon AL
    réécrit la luminosité juste après chaque commande de la molette, même si
    `intercept` est désactivé (deux mécanismes distincts).

    ## 📋 Prérequis
    - Philips Hue Tap Dial Switch (RDM002) appairé dans **Zigbee2MQTT**
    - Un helper `input_select` à 2 options
    - Home Assistant 2024.10.0 ou plus récent
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config/blob/main/blueprints/automation/lobdt/philips_hue_tap_dial_dynamic_dimming.yaml

  input:
    section_mqtt:
      name: 1️⃣ Connexion Zigbee2MQTT
      icon: mdi:zigbee
      input:
        z2m_topic:
          name: Topic MQTT de la télécommande
          description: >
            Topic Z2M complet, généralement `zigbee2mqtt/<Nom de la télécommande>`.
          selector:
            text:

    section_dimming:
      name: 2️⃣ Molette — Dimming dynamique
      icon: mdi:knob
      input:
        light_selector:
          name: Sélecteur de lampe (input_select)
          description: >
            Helper `input_select` à 2 options. Les noms doivent correspondre
            EXACTEMENT aux valeurs saisies ci-dessous.
          selector:
            entity:
              filter:
                - domain: input_select

        light_option_a_name:
          name: Option A — Nom dans l'input_select
          default: "Chambre-Plafond"
          selector:
            text:
        light_option_a_entity:
          name: Option A — Lampe contrôlée
          selector:
            entity:
              filter:
                - domain: light
        light_option_a_max:
          name: Option A — Puissance max de la courbe
          default: 110
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_a_min:
          name: Option A — Pas minimum
          default: 3
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider

        light_option_b_name:
          name: Option B — Nom dans l'input_select
          default: "Chambre-Ambiance"
          selector:
            text:

        light_option_b1_entity:
          name: Option B — Lampe 1 (référence, obligatoire)
          description: >
            Lampe de référence. Son min/max définit la courbe ; la Lampe 2
            (si présente) la suit via un coefficient, voir ci-dessous.
          selector:
            entity:
              filter:
                - domain: light
        light_option_b1_max:
          name: Option B — Lampe 1 — Puissance max de la courbe
          default: 130
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider
        light_option_b1_min:
          name: Option B — Lampe 1 — Pas minimum
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider

        light_option_b2_entity:
          name: Option B — Lampe 2 (optionnelle)
          description: >
            Deuxième lampe du slot B. Laisser vide si une seule lampe suffit.
            Son pas est dérivé de celui de la Lampe 1 via le coefficient
            ci-dessous — pas de min/max séparés à régler.
          default: []
          selector:
            entity:
              filter:
                - domain: light
        light_option_b2_ratio:
          name: Option B — Lampe 2 — Coefficient par rapport à la Lampe 1
          description: >
            Combien de fois la Lampe 2 est plus lumineuse que la Lampe 1, à
            % égal. Mesure : allumer les 2, ajuster jusqu'à rendu visuel
            équivalent, diviser % Lampe 1 par % Lampe 2. Exemple : 7 % / 1 %
            → coefficient 7. Le pas envoyé à la Lampe 2 = pas de la Lampe 1
            divisé par ce nombre, à chaque rotation.
          default: 7
          selector:
            number:
              min: 0.1
              max: 50
              step: 0.1
              mode: slider

        step_normalize:
          name: Normalisation du step_size
          default: 100
          selector:
            number:
              min: 50
              max: 255
              step: 5
              mode: slider

        action_on_rotate:
          name: Action supplémentaire à chaque rotation
          default: []
          selector:
            action:

    section_button_1:
      name: 3️⃣ Bouton 1
      icon: mdi:numeric-1-circle-outline
      input:
        button_1_short:
          name: Bouton 1 — Appui court
          default: []
          selector:
            action:
        button_1_long:
          name: Bouton 1 — Appui long
          default: []
          selector:
            action:

    section_button_2:
      name: 4️⃣ Bouton 2
      icon: mdi:numeric-2-circle-outline
      input:
        button_2_short:
          default: []
          selector:
            action:
        button_2_long:
          default: []
          selector:
            action:

    section_button_3:
      name: 5️⃣ Bouton 3
      icon: mdi:numeric-3-circle-outline
      input:
        button_3_short:
          default: []
          selector:
            action:
        button_3_long:
          default: []
          selector:
            action:

    section_button_4:
      name: 6️⃣ Bouton 4
      icon: mdi:numeric-4-circle-outline
      input:
        button_4_short:
          default: []
          selector:
            action:
        button_4_long:
          default: []
          selector:
            action:

    section_context:
      name: 7️⃣ Avancé — Suivi de contexte
      icon: mdi:cog
      collapsed: true
      input:
        last_pressed:
          name: Helper de suivi (input_text)
          default: []
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 10

trigger:
  - platform: mqtt
    topic: !input z2m_topic

variables:
  opt_a_name: !input light_option_a_name
  opt_a_entity: !input light_option_a_entity
  opt_a_min: !input light_option_a_min
  opt_a_max: !input light_option_a_max

  opt_b_name: !input light_option_b_name
  opt_b1_entity: !input light_option_b1_entity
  opt_b1_min: !input light_option_b1_min
  opt_b1_max: !input light_option_b1_max
  opt_b2_entity: !input light_option_b2_entity
  opt_b2_ratio: !input light_option_b2_ratio

  selector_entity: !input light_selector
  normalize: !input step_normalize

  act: "{{ trigger.payload_json.action | default('') }}"
  raw_step: "{{ trigger.payload_json.action_step_size | int(0) }}"
  direction: "{{ 'up' if act == 'brightness_step_up' else 'down' }}"
  selected: "{{ states(selector_entity) }}"
  norm: "{{ ([raw_step, normalize | int] | min) / (normalize | int) }}"

  # ── Lampe de référence : Option A seule, ou Lampe 1 si Option B ────
  ref_entity: "{{ opt_a_entity if selected == opt_a_name else opt_b1_entity }}"
  ref_min: "{{ opt_a_min if selected == opt_a_name else opt_b1_min }}"
  ref_max: "{{ opt_a_max if selected == opt_a_name else opt_b1_max }}"
  ref_step: "{{ [ [ (((norm | float) ** 3) * (ref_max | float)) | round(2), 100 ] | min, ref_min | float ] | max }}"

  # ── Construction de la liste des lampes à piloter ───────────────────
  #    Lampe 2 dérivée du pas de référence via le coefficient (pas de
  #    min/max séparés). Lampes unavailable/unknown exclues.
  targets: >
    {% set ns = namespace(items=[]) %}
    {% set st_ref = states(ref_entity) %}
    {% if st_ref in ['on', 'off'] %}
      {% set ns.items = ns.items + [{
           'entity': ref_entity,
           'step': ref_step,
           'signed': ref_step if direction == 'up' else (ref_step * -1),
           'is_off': st_ref == 'off'
         }] %}
    {% endif %}
    {% if selected != opt_a_name and opt_b2_entity %}
      {% set st2 = states(opt_b2_entity) %}
      {% if st2 in ['on', 'off'] %}
        {% set step2 = (ref_step / (opt_b2_ratio | float)) | round(2) %}
        {% set ns.items = ns.items + [{
             'entity': opt_b2_entity,
             'step': step2,
             'signed': step2 if direction == 'up' else (step2 * -1),
             'is_off': st2 == 'off'
           }] %}
      {% endif %}
    {% endif %}
    {{ ns.items }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.is_off and direction == 'up' }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            brightness_pct: "{{ repeat.item.step }}"
                            transition: 0
                    - conditions:
                        - condition: template
                          value_template: "{{ not repeat.item.is_off }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            brightness_step_pct: "{{ repeat.item.signed }}"
                            transition: 0

          - alias: Action supplémentaire optionnelle sur rotation
            sequence: !input action_on_rotate

      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_press_release' }}"
        sequence: !input button_1_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_hold_release' }}"
        sequence: !input button_1_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_press_release' }}"
        sequence: !input button_2_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_hold_release' }}"
        sequence: !input button_2_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_press_release' }}"
        sequence: !input button_3_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_hold_release' }}"
        sequence: !input button_3_long
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_press_release' }}"
        sequence: !input button_4_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_hold_release' }}"
        sequence: !input button_4_long
