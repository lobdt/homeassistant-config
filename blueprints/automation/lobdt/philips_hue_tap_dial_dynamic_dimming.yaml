# =============================================================================
#  Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT)
#  Version : 2.1.0  —  07/08/2026
#
#  CHANGELOG
#  2.1.0 - Elargissement des plages de calibration (selecteurs uniquement,
#          logique inchangee) :
#          * "Puissance max" : plancher 50 -> 1, pas 5 -> 1.
#            Motif : une lampe nettement plus lumineuse que sa voisine peut
#            demander un max tres bas (mesure terrain : ratio x7 entre une
#            KAJPLATS 1521lm et une Hue -> max calcule a 19, impossible a
#            saisir avec l'ancien plancher a 50).
#          * "Pas minimum" : plancher 1 -> 0.5, pas 1 -> 0.5.
#            Motif : le pas minimum s'applique meme sur la rotation la plus
#            douce ; sur une lampe puissante, un plancher a 1 % produit deja
#            un saut visuel important.
#          Applique aux trois emplacements (A, B1, B2) et pas seulement a B2,
#          pour ne pas reproduire la limite ailleurs.
#  2.0.0 - Support multi-lampes sur l'option B : jusqu'a 2 lampes, chacune
#          avec son propre couple min/max (utile quand les flux lumineux
#          different). Bonus : envoi individuel par lampe, ce qui evite la
#          limite de debit des groupes Zigbee (~1 commande/seconde).
#        - Fix : une lampe eteinte demarre desormais a 0 % au premier cran.
#          Avant, brightness_step_pct s'appliquait sur la derniere luminosite
#          memorisee par la lampe, la rallumant a un niveau imprevisible.
#          Strategie hybride : absolu au premier cran depuis l'extinction,
#          relatif ensuite (voir section "Strategie de dimming").
#        - Robustesse : les lampes unavailable/unknown sont ignorees au lieu
#          d'etre traitees comme eteintes.
#  1.0.0 - Version initiale : dimming cubique, 2 options mono-lampe.
#
#  NOTE Adaptive Lighting : si AL pilote une lampe controlee ici, activer
#  "adapt_only_on_bare_turn_on" sur l'instance AL correspondante. Sinon AL
#  reecrit la luminosite juste apres chaque commande de la molette, meme
#  quand "intercept" est desactive.
# =============================================================================
blueprint:
  name: Hue Tap Dial - Dimming Dynamique Multi-Lampes (Z2M / MQTT) v2.1.0
  description: >
    # 🎛️ Philips Hue Tap Dial — Dimming Dynamique via MQTT

    **Version 2.1.0**

    Blueprint maison pour piloter un **Philips Hue Tap Dial Switch** via
    Zigbee2MQTT, avec un **dimming dynamique à courbe cubique** : tourner
    doucement la molette ajuste finement la luminosité, un gros coup rapide
    l'envoie quasiment à fond.

    ## ✨ Fonctions clés
    - **Multi-lampes** : l'option B pilote jusqu'à 2 lampes, chacune avec son
      propre couple min/max — indispensable quand les lampes du groupe n'ont
      pas le même flux lumineux.
    - **Départ à 0 %** : une lampe éteinte démarre au premier cran depuis 0,
      au lieu de se rallumer à sa dernière luminosité mémorisée.

    ## 🧠 Stratégie de dimming
    - Lampe **allumée** → `brightness_step_pct` **relatif** : c'est la lampe
      qui calcule, donc aucun aller-retour d'état. Pas de latence, pas de
      saturation Zigbee en rotation rapide.
    - Lampe **éteinte** + rotation ↑ → `brightness_pct` **absolu** pour ce seul
      premier cran, garantissant un départ depuis 0.
    - Lampe **éteinte** + rotation ↓ → aucune action, elle reste éteinte.
    - Lampe **indisponible** → ignorée.

    ## 📐 Calibrer deux lampes de puissances différentes
    Allumer les deux lampes et chercher le pourcentage de chacune qui donne le
    même rendu visuel. Le rapport obtenu est le facteur à appliquer.
    Exemple mesuré : 7 % sur une Hue ≈ 1 % sur une KAJPLATS 1521 lm → facteur 7,
    donc `max` de la KAJPLATS = 130 / 7 ≈ 19, et son `min` au plus bas possible.

    ## ⚠️ Adaptive Lighting
    Si Adaptive Lighting pilote une des lampes, activer
    **`adapt_only_on_bare_turn_on`** sur l'instance AL concernée. Sans ça, AL
    réécrit la luminosité juste après chaque commande de la molette — et ce,
    même si `intercept` est désactivé (ce sont deux mécanismes distincts).

    ## 📋 Prérequis
    - Philips Hue Tap Dial Switch (RDM002) appairé dans **Zigbee2MQTT**
    - Un helper `input_select` à 2 options, dont les noms correspondent
      exactement aux champs "Nom dans l'input_select" ci-dessous
    - Home Assistant 2024.10.0 ou plus récent
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/lobdt/homeassistant-config/blob/main/blueprints/automation/lobdt/philips_hue_tap_dial_dynamic_dimming.yaml

  input:
    # ──────────────────────────────────────────────────────────────
    section_mqtt:
      name: 1️⃣ Connexion Zigbee2MQTT
      icon: mdi:zigbee
      input:
        z2m_topic:
          name: Topic MQTT de la télécommande
          description: >
            Topic Z2M complet de la télécommande, généralement
            `zigbee2mqtt/<Nom de la télécommande>`.
            Exemple : `zigbee2mqtt/Chambre-Telecommande-Porte`
          selector:
            text:

    # ──────────────────────────────────────────────────────────────
    section_dimming:
      name: 2️⃣ Molette — Dimming dynamique
      icon: mdi:knob
      input:
        light_selector:
          name: Sélecteur de lampe (input_select)
          description: >
            Helper `input_select` à 2 options qui détermine ce que la molette
            contrôle. Les noms des 2 options doivent correspondre exactement
            aux valeurs saisies plus bas (Option A / Option B).
          selector:
            entity:
              filter:
                - domain: input_select

        light_option_a_name:
          name: Option A — Nom dans l'input_select
          description: Le nom EXACT de la 1ʳᵉ option (sensible à la casse).
          default: "Chambre-Plafond"
          selector:
            text:

        light_option_a_entity:
          name: Option A — Lampe contrôlée
          description: La lampe à piloter quand l'option A est sélectionnée.
          selector:
            entity:
              filter:
                - domain: light

        light_option_a_max:
          name: Option A — Puissance max de la courbe
          description: >
            Amplitude maximale du dimming pour cette lampe (plus haut = plus
            sensible sur les gros coups). 110 = un gros coup atteint ~100 %.
            Descendre fortement pour une lampe beaucoup plus lumineuse que les
            autres (voir "Calibrer deux lampes" dans la description).
          default: 110
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider

        light_option_a_min:
          name: Option A — Pas minimum
          description: >
            Pas minimum garanti sur un tout petit cran lent (en %). S'applique
            même sur la rotation la plus douce : baisser au maximum sur une
            lampe puissante, sinon le moindre geste produit un saut visible.
          default: 3
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider

        light_option_b_name:
          name: Option B — Nom dans l'input_select
          description: Le nom EXACT de la 2ᵉ option (sensible à la casse).
          default: "Chambre-Ambiance"
          selector:
            text:

        light_option_b1_entity:
          name: Option B — Lampe 1 (obligatoire)
          description: Première lampe pilotée quand l'option B est sélectionnée.
          selector:
            entity:
              filter:
                - domain: light

        light_option_b1_max:
          name: Option B — Lampe 1 — Puissance max de la courbe
          description: >
            Amplitude maximale du dimming pour cette lampe. Sert de référence
            pour calibrer la lampe 2 (voir description du blueprint).
          default: 130
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider

        light_option_b1_min:
          name: Option B — Lampe 1 — Pas minimum
          description: Pas minimum garanti sur un tout petit cran lent (en %).
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider

        light_option_b2_entity:
          name: Option B — Lampe 2 (optionnelle)
          description: >
            Deuxième lampe du slot B, si le groupe en contient plusieurs.
            Laisser vide si une seule lampe suffit.
          default: []
          selector:
            entity:
              filter:
                - domain: light

        light_option_b2_max:
          name: Option B — Lampe 2 — Puissance max de la courbe
          description: >
            À calibrer par rapport à la lampe 1. Si cette lampe est N fois plus
            lumineuse, diviser le max de la lampe 1 par N.
            Exemple : lampe 1 à 130, rapport mesuré ×7 → mettre ≈ 19.
          default: 19
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider

        light_option_b2_min:
          name: Option B — Lampe 2 — Pas minimum
          description: >
            Pas minimum garanti sur un tout petit cran lent (en %). Sur une
            lampe nettement plus lumineuse que la lampe 1, viser le minimum.
          default: 0.5
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider

        step_normalize:
          name: Normalisation du step_size
          description: >
            Valeur de `action_step_size` considérée comme « gros coup » maximal.
            La molette Hue rapporte généralement jusqu'à ~100-150 par message.
            100 est un bon défaut. Baisser = plus sensible globalement.
          default: 100
          selector:
            number:
              min: 50
              max: 255
              step: 5
              mode: slider

        action_on_rotate:
          name: Action supplémentaire à chaque rotation
          description: >
            Action(s) optionnelle(s) exécutée(s) à CHAQUE cran de molette, en
            plus du dimming. Typiquement : activer un `input_boolean` de bypass
            manuel pour empêcher un capteur de mouvement de reprendre la main
            pendant qu'on ajuste la lumière. Laisser vide pour ne rien faire.
          default: []
          selector:
            action:

    # ──────────────────────────────────────────────────────────────
    section_button_1:
      name: 3️⃣ Bouton 1
      icon: mdi:numeric-1-circle-outline
      input:
        button_1_short:
          name: Bouton 1 — Appui court
          description: >
            Action sur appui court. Par défaut on y met
            `input_select.select_next` pour basculer la lampe contrôlée.
          default: []
          selector:
            action:
        button_1_long:
          name: Bouton 1 — Appui long
          description: Action sur appui long.
          default: []
          selector:
            action:

    section_button_2:
      name: 4️⃣ Bouton 2
      icon: mdi:numeric-2-circle-outline
      input:
        button_2_short:
          name: Bouton 2 — Appui court
          default: []
          selector:
            action:
        button_2_long:
          name: Bouton 2 — Appui long
          default: []
          selector:
            action:

    section_button_3:
      name: 5️⃣ Bouton 3
      icon: mdi:numeric-3-circle-outline
      input:
        button_3_short:
          name: Bouton 3 — Appui court
          default: []
          selector:
            action:
        button_3_long:
          name: Bouton 3 — Appui long
          default: []
          selector:
            action:

    section_button_4:
      name: 6️⃣ Bouton 4
      icon: mdi:numeric-4-circle-outline
      input:
        button_4_short:
          name: Bouton 4 — Appui court
          default: []
          selector:
            action:
        button_4_long:
          name: Bouton 4 — Appui long
          default: []
          selector:
            action:

    # ──────────────────────────────────────────────────────────────
    section_context:
      name: 7️⃣ Avancé — Suivi de contexte
      icon: mdi:cog
      collapsed: true
      input:
        last_pressed:
          name: Helper de suivi (input_text)
          description: >
            Helper `input_text` optionnel pour suivre le dernier bouton pressé.
            Laissé tel quel par ce blueprint pour compatibilité ; les boutons
            peuvent le remettre à "1" via leurs propres actions si besoin.
          default: []
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 10

trigger:
  - platform: mqtt
    topic: !input z2m_topic

variables:
  # ── Inputs accessibles dans les templates ──────────────────────
  opt_a_name: !input light_option_a_name
  opt_a_entity: !input light_option_a_entity
  opt_a_min: !input light_option_a_min
  opt_a_max: !input light_option_a_max

  opt_b_name: !input light_option_b_name
  opt_b1_entity: !input light_option_b1_entity
  opt_b1_min: !input light_option_b1_min
  opt_b1_max: !input light_option_b1_max
  opt_b2_entity: !input light_option_b2_entity
  opt_b2_min: !input light_option_b2_min
  opt_b2_max: !input light_option_b2_max

  selector_entity: !input light_selector
  normalize: !input step_normalize

  # ── Lecture du message molette ─────────────────────────────────
  act: "{{ trigger.payload_json.action | default('') }}"
  raw_step: "{{ trigger.payload_json.action_step_size | int(0) }}"
  direction: "{{ 'up' if act == 'brightness_step_up' else 'down' }}"
  selected: "{{ states(selector_entity) }}"
  norm: "{{ ([raw_step, normalize | int] | min) / (normalize | int) }}"

  # ── Lampes concernées selon l'option sélectionnée ──────────────
  active_lights: >
    {% if selected == opt_a_name %}
      {{ [{'entity': opt_a_entity, 'min': opt_a_min, 'max': opt_a_max}] }}
    {% else %}
      {% set ns = namespace(items=[{'entity': opt_b1_entity, 'min': opt_b1_min, 'max': opt_b1_max}]) %}
      {% if opt_b2_entity %}
        {% set ns.items = ns.items + [{'entity': opt_b2_entity, 'min': opt_b2_min, 'max': opt_b2_max}] %}
      {% endif %}
      {{ ns.items }}
    {% endif %}

  # ── Courbe CUBIQUE appliquée PAR LAMPE, avec ses propres bornes ─
  #    Les lampes unavailable/unknown sont exclues de la liste.
  #    Le step reste en float pour supporter les pas < 1 %.
  targets: >
    {% set ns = namespace(items=[]) %}
    {% for l in active_lights %}
      {% set st = states(l.entity) %}
      {% if st in ['on', 'off'] %}
        {% set step = [ [ (((norm | float) ** 3) * (l.max | float)) | round(1), 100 ] | min, l.min | float ] | max %}
        {% set ns.items = ns.items + [{
             'entity': l.entity,
             'step': step,
             'signed': step if direction == 'up' else (step * -1),
             'is_off': st == 'off'
           }] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

action:
  - choose:
      # ── MOLETTE : dimming dynamique multi-lampes ─────────────────
      - conditions:
          - condition: template
            value_template: "{{ act in ['brightness_step_up', 'brightness_step_down'] }}"
        sequence:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - choose:
                    # Éteinte + rotation ↑ → départ ABSOLU depuis 0 %
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item.is_off and direction == 'up' }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            brightness_pct: "{{ repeat.item.step }}"
                            transition: 0
                    # Allumée → step RELATIF (comportement d'origine)
                    - conditions:
                        - condition: template
                          value_template: "{{ not repeat.item.is_off }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            brightness_step_pct: "{{ repeat.item.signed }}"
                            transition: 0
                  # Éteinte + rotation ↓ → aucune branche : reste éteinte

          - alias: Action supplémentaire optionnelle sur rotation
            sequence: !input action_on_rotate

      # ── BOUTON 1 ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_press_release' }}"
        sequence: !input button_1_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_1_hold_release' }}"
        sequence: !input button_1_long

      # ── BOUTON 2 ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_press_release' }}"
        sequence: !input button_2_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_2_hold_release' }}"
        sequence: !input button_2_long

      # ── BOUTON 3 ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_press_release' }}"
        sequence: !input button_3_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_3_hold_release' }}"
        sequence: !input button_3_long

      # ── BOUTON 4 ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_press_release' }}"
        sequence: !input button_4_short
      - conditions:
          - condition: template
            value_template: "{{ act == 'button_4_hold_release' }}"
        sequence: !input button_4_long
