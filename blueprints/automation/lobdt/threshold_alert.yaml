blueprint:
  name: Threshold Alert & Repeat
  description: >
    # 🔔 Threshold Alert & Repeat

    **Version: 4.0**


    Envoie une notification répétée tant qu'un capteur dépasse un seuil ou
    qu'un appareil est dans un état indésirable. Notifie aussi quand le
    problème est résolu. Détecte aussi si le capteur ne répond plus.


    **Cas d'usage typiques :**
    - Frigo / congélateur trop chaud
    - Détecteur d'inondation
    - Capteur CO₂ trop élevé
    - Porte ouverte trop longtemps


    **Fonctionnement :**

    1. Remplis soit **Entité numérique** soit **Entité état** (pas les deux).
    2. Le trigger se déclenche quand le seuil/état est atteint pendant le délai de confirmation.
    3. La notification d'alerte est envoyée, puis répétée à intervalle régulier.
    4. Quand le problème se résout, une notification de retour à la normale est envoyée.
    5. Si le capteur ne répond plus (unavailable ou données trop anciennes),
       une notification dédiée est envoyée.

  domain: automation
  author: lobdt
  input:

    # ─────────────────────────────────────────────────────
    section_trigger:
      name: 1️⃣ Déclencheur
      icon: mdi:alert-circle-outline
      collapsed: false
      input:

        numeric_entity:
          name: Entité numérique (optionnel)
          description: >
            Capteur numérique à surveiller. L'alerte se déclenche si la valeur
            dépasse le **Seuil** ci-dessous.

            Ex: `sensor.cuisine_thermometre_frigo_temperature`

            Laisser vide si tu utilises une entité état.
          default: []
          selector:
            entity:
              domain:
                - sensor
                - input_number

        numeric_above:
          name: Seuil — Au-dessus de
          description: >
            L'alerte se déclenche si la valeur dépasse ce seuil.
            Ex: `8` pour un frigo (°C), `-10` pour un congélateur.
          default: 0
          selector:
            number:
              min: -100
              max: 10000
              step: 0.5
              unit_of_measurement: ""
              mode: box

        state_entity:
          name: Entité état (optionnel)
          description: >
            Entité dont l'état déclenche l'alerte.
            Ex: `binary_sensor.cuisine_inondation`

            Laisser vide si tu utilises une entité numérique.
          default: []
          selector:
            entity: {}

        alert_state:
          name: État déclencheur
          description: >
            État qui déclenche l'alerte.
            Ex: `on`, `detected`, `wet`, `open`
          default: "on"
          selector:
            text: {}

        confirmation_delay:
          name: Délai de confirmation avant alerte
          description: >
            Attendre ce délai avant d'envoyer la première notification.
            Évite les fausses alertes (ex: ouverture de porte de frigo).
          default:
            minutes: 10
          selector:
            duration: {}

    # ─────────────────────────────────────────────────────
    section_notification:
      name: 2️⃣ Notifications
      icon: mdi:bell-outline
      collapsed: false
      input:

        notify_entity:
          name: Entité de notification
          description: >
            L'entité notify à utiliser.
            Ex: `notify.iphones_loic_alina`, `notify.mobile_app_iphone_loic`
          default: notify.notify
          selector:
            entity:
              domain: notify

        alert_title:
          name: Titre de l'alerte
          default: "⚠️ Alerte capteur"
          selector:
            text: {}

        alert_message:
          name: Message d'alerte
          description: >
            Tu peux utiliser des templates :
            `{{ states('sensor.xxx') }}` pour la valeur actuelle.
          default: "Un capteur a dépassé son seuil !"
          selector:
            text:
              multiline: true

        resolved_title:
          name: Titre — Retour à la normale (optionnel)
          description: Laisser vide pour ne pas notifier au retour à la normale.
          default: "✅ Retour à la normale"
          selector:
            text: {}

        resolved_message:
          name: Message — Retour à la normale (optionnel)
          default: "Le capteur est revenu à la normale."
          selector:
            text:
              multiline: true

    # ─────────────────────────────────────────────────────
    section_repeat:
      name: 3️⃣ Répétition
      icon: mdi:repeat
      collapsed: false
      input:

        repeat_interval:
          name: Intervalle de répétition
          description: >
            Nouvelle notification envoyée à cet intervalle tant que le problème
            persiste. Mettre à 0 pour désactiver la répétition.
          default:
            minutes: 30
          selector:
            duration: {}

    # ─────────────────────────────────────────────────────
    section_watchdog:
      name: 4️⃣ Surveillance capteur mort (optionnel)
      icon: mdi:wifi-off
      collapsed: true
      input:

        max_age_minutes:
          name: Âge maximum des données (minutes)
          description: >
            Si le capteur n'envoie plus de données depuis ce nombre de minutes,
            une notification d'alerte est envoyée. Couvre aussi le cas
            `unavailable` ou `unknown`.

            Mettre à `0` pour désactiver cette surveillance.

            Valeur recommandée : 60 min pour un capteur Zigbee sur pile.
          default: 0
          selector:
            number:
              min: 0
              max: 1440
              step: 5
              unit_of_measurement: min
              mode: slider

        watchdog_title:
          name: Titre — Capteur mort
          default: "📡 Capteur hors ligne"
          selector:
            text: {}

        watchdog_message:
          name: Message — Capteur mort
          description: >
            Message envoyé quand le capteur ne répond plus.
          default: "Un capteur ne répond plus depuis trop longtemps !"
          selector:
            text:
              multiline: true

variables:
  numeric_entity: !input numeric_entity
  numeric_above: !input numeric_above
  state_entity: !input state_entity
  alert_state: !input alert_state
  notify_entity: !input notify_entity
  alert_title: !input alert_title
  alert_message: !input alert_message
  resolved_title: !input resolved_title
  resolved_message: !input resolved_message
  repeat_interval: !input repeat_interval
  max_age_minutes: !input max_age_minutes
  watchdog_title: !input watchdog_title
  watchdog_message: !input watchdog_message
  # Entité surveillée (numérique ou état)
  watched_entity: >
    {% if numeric_entity | default([]) | length > 0 %}
      {{ numeric_entity }}
    {% else %}
      {{ state_entity }}
    {% endif %}
  # Secondes totales de l'intervalle — calculé une fois, utilisé dans while
  repeat_seconds: >
    {{ (repeat_interval.hours | default(0)) * 3600
       + (repeat_interval.minutes | default(0)) * 60
       + (repeat_interval.seconds | default(0)) }}

trigger:
  # Trigger numérique — valeur dépasse le seuil
  # Si numeric_entity est vide ([]), ce trigger ne se déclenche jamais
  - trigger: numeric_state
    entity_id: !input numeric_entity
    above: !input numeric_above
    for: !input confirmation_delay
    id: alert_numeric

  # Trigger état — entité passe à l'état déclencheur
  # Si state_entity est vide ([]), ce trigger ne se déclenche jamais
  - trigger: state
    entity_id: !input state_entity
    to: !input alert_state
    for: !input confirmation_delay
    id: alert_state

  # Trigger retour à la normale — numérique repasse sous le seuil
  - trigger: numeric_state
    entity_id: !input numeric_entity
    below: !input numeric_above
    id: resolved_numeric

  # Trigger retour à la normale — état quitte l'état déclencheur
  - trigger: state
    entity_id: !input state_entity
    from: !input alert_state
    id: resolved_state

  # Trigger capteur unavailable/unknown
  - trigger: state
    entity_id: !input numeric_entity
    to:
      - unavailable
      - unknown
    for:
      minutes: 5
    id: watchdog_unavailable_numeric

  - trigger: state
    entity_id: !input state_entity
    to:
      - unavailable
      - unknown
    for:
      minutes: 5
    id: watchdog_unavailable_state

  # Trigger watchdog périodique — vérifie l'âge des données toutes les heures
  - trigger: time_pattern
    hours: "/1"
    id: watchdog_periodic

condition: []

action:
  - choose:

    # ── Alerte déclenchée ─────────────────────────────────────────────────
    - conditions:
        - condition: trigger
          id:
            - alert_numeric
            - alert_state
      sequence:
        - action: notify.send_message
          target:
            entity_id: !input notify_entity
          data:
            title: "{{ alert_title }}"
            message: "{{ alert_message }}"

        - repeat:
            while:
              - condition: template
                value_template: "{{ repeat_seconds > 0 }}"
              - condition: template
                value_template: >
                  {% if numeric_entity | default([]) | length > 0 %}
                    {{ states(numeric_entity) | float(0) > numeric_above | float(0) }}
                  {% else %}
                    {{ states(state_entity) == alert_state }}
                  {% endif %}
            sequence:
              - wait_for_trigger:
                  - trigger: numeric_state
                    entity_id: !input numeric_entity
                    below: !input numeric_above
                  - trigger: state
                    entity_id: !input state_entity
                    from: !input alert_state
                timeout: !input repeat_interval
                continue_on_timeout: true
              - condition: template
                value_template: >
                  {% if numeric_entity | default([]) | length > 0 %}
                    {{ states(numeric_entity) | float(0) > numeric_above | float(0) }}
                  {% else %}
                    {{ states(state_entity) == alert_state }}
                  {% endif %}
              - action: notify.send_message
                target:
                  entity_id: !input notify_entity
                data:
                  title: "{{ alert_title }}"
                  message: "{{ alert_message }}"

    # ── Retour à la normale ───────────────────────────────────────────────
    - conditions:
        - condition: trigger
          id:
            - resolved_numeric
            - resolved_state
        - condition: template
          value_template: "{{ resolved_title | length > 0 }}"
      sequence:
        - action: notify.send_message
          target:
            entity_id: !input notify_entity
          data:
            title: "{{ resolved_title }}"
            message: "{{ resolved_message }}"

    # ── Capteur unavailable/unknown ───────────────────────────────────────
    - conditions:
        - condition: trigger
          id:
            - watchdog_unavailable_numeric
            - watchdog_unavailable_state
        - condition: template
          value_template: "{{ max_age_minutes > 0 }}"
      sequence:
        - action: notify.send_message
          target:
            entity_id: !input notify_entity
          data:
            title: "{{ watchdog_title }}"
            message: "{{ watchdog_message }}"

    # ── Watchdog périodique — données trop anciennes ──────────────────────
    - conditions:
        - condition: trigger
          id: watchdog_periodic
        - condition: template
          value_template: "{{ max_age_minutes > 0 }}"
        - condition: template
          value_template: >
            {% if watched_entity | length > 0 %}
              {% set last = states[watched_entity].last_updated %}
              {{ (now() - last).total_seconds() / 60 > max_age_minutes }}
            {% else %}
              false
            {% endif %}
      sequence:
        - action: notify.send_message
          target:
            entity_id: !input notify_entity
          data:
            title: "{{ watchdog_title }}"
            message: "{{ watchdog_message }}"

mode: restart
